---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-grafana
spec:
  podSelector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: envoy-grafana
      gateway.envoyproxy.io/owning-gateway-namespace: network
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: 10443
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - protocol: TCP
          port: 19001
