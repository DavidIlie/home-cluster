---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: portainer
spec:
  interval: 6h
  dependsOn:
    - name: openebs
      namespace: openebs-system
  chart:
    spec:
      chart: portainer
      version: 245.3.0
      sourceRef:
        kind: HelmRepository
        name: portainer
        namespace: flux-system
  values:
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    persistence:
      enabled: true
      size: 1G
      storageClass: openebs-hostpath
    ingress:
      enabled: true
      ingressClassName: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/name: Portainer
        gethomepage.dev/icon: portainer.png
        gethomepage.dev/description: Container Management
        external-dns.alpha.kubernetes.io/controller: none
        gatus.home-operations.com/enabled: "false"
      hosts:
        - host: &host "portainer.davidhome.ro"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - hosts:
            - *host
