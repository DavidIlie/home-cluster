---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: portainer
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Portainer (Envoy)
      group: Infrastructure
      url: https://portainer.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - portainer.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: portainer
          port: 9000
