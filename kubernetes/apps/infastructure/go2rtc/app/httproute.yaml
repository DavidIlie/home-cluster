---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: go2rtc
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: go2rtc (Envoy)
      group: Infrastructure
      url: https://go2rtc.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - go2rtc.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: go2rtc
          port: 1984
