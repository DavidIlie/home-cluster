---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app scrypted
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      scrypted:
        type: deployment
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          hostNetwork: true
          runtimeClassName: nvidia
        containers:
          app:
            image:
              repository: ghcr.io/koush/scrypted
              tag: v0.146.0-noble-nvidia@sha256:9ee15f7c95a9da5688cb02163d08c98c82736e2f33c39ebe71815db640358b4c
            resources:
              requests:
                cpu: 136m
                memory: 1Gi
              limits:
                memory: 4Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
    service:
      app:
        controller: scrypted
        ports:
          http:
            port: 10443
            primary: true
    ingress:
      app:
        className: "internal"
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: Scrypted
          gethomepage.dev/icon: scrypted.png
          gethomepage.dev/description: Smart Home Hub
          gatus.home-operations.com/endpoint: |-
            name: Scrypted
            group: Infrastructure
            url: https://scrypted.infastructure.svc.cluster.local:10443
            interval: 1m
            client:
              insecure: true
            conditions: ["[STATUS] == any(200, 302)"]
        hosts:
          - host: scrypted.davidhome.ro
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        enabled: true
        existingClaim: config-scrypted
        advancedMounts:
          scrypted:
            app:
              - path: /server/volume
      cache:
        type: emptyDir
        globalMounts:
          - path: /.cache
      cache-npm:
        type: emptyDir
        globalMounts:
          - path: /.npm
