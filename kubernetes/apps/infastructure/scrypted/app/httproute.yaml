---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scrypted
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Scrypted (Envoy)
      group: Infrastructure
      url: https://scrypted.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - scrypted.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: scrypted
