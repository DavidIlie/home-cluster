---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: cilium-helm-values
  values:
    hubble:
      enabled: true
      # The default "helm" method issues Hubble's TLS certs once and never
      # renews them; they expired on 2026-09-29 and hubble-relay has failed
      # every handshake since. certgen re-issues the 365-day leaf certs every
      # four months. It refuses to sign leaves that outlive the cilium-ca
      # secret, so a failing hubble-generate-certs Job means: rotate the CA.
      tls:
        auto:
          enabled: true
          method: cronJob
          schedule: "0 0 1 */4 *"
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          serviceMonitor:
            enabled: true
        resources:
          requests:
            memory: 48Mi
      ui:
        enabled: true
        rollOutPods: true
        backend:
          resources:
            requests:
              memory: 32Mi
        frontend:
          resources:
            requests:
              memory: 32Mi
        ingress:
          enabled: true
          className: internal
          hosts: ["hubble.davidhome.ro"]
    operator:
      resources:
        requests:
          memory: 160Mi
