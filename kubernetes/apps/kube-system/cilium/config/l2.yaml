---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # NOTE: interfaces might need to be set if you have more than one active NIC on your hosts
  # interfaces:
  #   - ^eno[0-9]+
  #   - ^eth[0-9]+
  # Labelling a node maintenance.davidapps.dev/exclude-from-l2=true moves its
  # L2 leases elsewhere before a drain. Never select on
  # node.kubernetes.io/exclude-from-external-load-balancers: Talos sets it on
  # every control-plane node, and excluding it stopped all announcements here
  # on 2026-10-20 (#853).
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
    matchExpressions:
      - key: maintenance.davidapps.dev/exclude-from-l2
        operator: DoesNotExist
