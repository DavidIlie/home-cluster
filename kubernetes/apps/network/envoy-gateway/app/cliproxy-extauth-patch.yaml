apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: cliproxy-management-extauth-set-cookie
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-grafana
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: network/envoy-grafana/https
      operation:
        op: add
        jsonPath: $.filter_chains[*].filters[?(@.name=='envoy.filters.network.http_connection_manager')].typed_config.http_filters[?(@.name=='envoy.filters.http.ext_authz/securitypolicy/default/cliproxy-management')].typed_config.http_service
        path: /authorization_response/allowed_client_headers_on_success
        value:
          patterns:
            - exact: set-cookie
              ignore_case: true
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      name: network/envoy-grafana/https
      operation:
        op: add
        jsonPath: $.filter_chains[*].filters[?(@.name=='envoy.filters.network.http_connection_manager')].typed_config.http_filters[?(@.name=='envoy.filters.http.ext_authz/securitypolicy/default/cliproxy-management')].typed_config.http_service
        path: /authorization_request/headers_to_add
        value:
          - key: x-real-ip
            value: '%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%'
