---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-webhook
  annotations:
    gatus.home-operations.com/enabled: "false"
    external-dns.alpha.kubernetes.io/target: "external.davidhome.ro"
    # GET /hook/ is answered by the notification-controller receiver with 404
    # (it only serves POST on /hook/<id>) - proves the tunnel + ingress path works.
    gatus.home-operations.com/endpoint: |-
      name: Flux Webhook
      group: Infrastructure
      url: https://flux-webhook.davidhome.ro/hook/
      interval: 1m
      conditions: ["[STATUS] == 404"]
spec:
  ingressClassName: external
  rules:
    - host: "flux-webhook.davidhome.ro"
      http:
        paths:
          - path: /hook/
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-webhook
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Flux Webhook (Envoy)
      group: Infrastructure
      url: https://flux-webhook.davidhome.ro/hook/
      interval: 1m
      client:
        dns-resolver: tcp://1.1.1.1:53
      conditions: ["[STATUS] == 404"]
spec:
  hostnames:
    - flux-webhook.davidhome.ro
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /hook/
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%REQ(cf-connecting-ip)%"
      backendRefs:
        - name: webhook-receiver
          port: 80
