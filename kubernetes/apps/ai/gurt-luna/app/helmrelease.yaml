apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gurt-luna
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      gurt-luna:
        replicas: 2
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          imagePullSecrets:
            - name: docker-regcred
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
        containers:
          app:
            image:
              repository: ghcr.io/davidilie/cliproxyapi
              tag: ee479a3a925a79f0b642071fac4c5c5ca2b0f1ad
            command: ["/CLIProxyAPI/gurt-router"]
            env:
              CLIPROXY_URL: http://cliproxy.default.svc.cluster.local:8317
            envFrom:
              - secretRef:
                  name: gurt-luna-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
    service:
      app:
        controller: gurt-luna
        ports:
          http:
            port: 8080
