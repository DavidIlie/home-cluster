apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gurt-luna
  namespace: ai
spec:
  interval: 30m
  retryInterval: 1m
  path: ./kubernetes/apps/ai/gurt-luna/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  timeout: 10m
  wait: true
