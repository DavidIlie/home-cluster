---
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageBucket
metadata:
  name: gha-cache-canary
spec:
  clusterRef:
    name: ci-cache-canary
  quotas:
    maxSize: 6Gi
    maxObjects: 10000
  lifecycle:
    rules:
      - id: expire-canary-cache
        status: Enabled
        expirationDays: 7
        abortIncompleteMultipartUploadDays: 1
