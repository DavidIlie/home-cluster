---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: davidapps-auth-gate
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: davidapps-auth-gate
  filterTags:
    pattern: "^release-(?P<number>[0-9]+)$"
    extract: "$number"
  policy:
    numerical:
      order: asc
  digestReflectionPolicy: Always
  interval: 1m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: davidapps-auth-gate
  namespace: flux-system
spec:
  image: ghcr.io/davidilie/davidapps-auth-gate
  interval: 1m0s
  secretRef:
    name: docker-regcred
