---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: davidapps-gate
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: davidapps-gate
      app.kubernetes.io/component: gate
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
