---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: davidapps-replay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: davidapps-replay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: davidapps-replay
        app.kubernetes.io/part-of: davidapps-auth
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dragonfly
          image: ghcr.io/dragonflydb/dragonfly:v1.40.1@sha256:ebf3c6c213e82fb51b4521660cca13f06f3421dc5b1ed14f2f474c50b5e29986
          imagePullPolicy: IfNotPresent
          args:
            - --logtostderr
            - --bind=0.0.0.0
            - --port=6379
            - --maxmemory=256mb
            - --cache_mode=true
            - --dir=/tmp
            - --dbfilename=
            - --proactor_threads=1
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: davidapps-replay
spec:
  selector:
    app.kubernetes.io/name: davidapps-replay
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
