apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: davidapps-gate-revocation
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - gate-home.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /internal/revoke
      backendRefs:
        - name: davidapps-gate
          port: 8080
