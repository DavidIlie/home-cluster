---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana-bostan
  namespace: &namespace observability
spec:
  suspend: true
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: *app
  path: ./kubernetes/apps/observability/grafana-bostan/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
