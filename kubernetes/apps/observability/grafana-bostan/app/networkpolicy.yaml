---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bostan-query-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bostan-query-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana-bostan
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus-davidapps-cluster
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: prometheus-home-cluster
      ports:
        - port: 9090
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-logs-single
              app.kubernetes.io/instance: victoria-logs
      ports:
        - port: 9428
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-bostan
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-bostan
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/instance: external-ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - port: 3000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bostan-query-gateway
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-bostan-https
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-bostan
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: id.davidapps.dev
        - matchName: grafana.com
        - matchName: storage.googleapis.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
