---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.3.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: kube-prometheus-stack-crds
      namespace: observability
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      enabled: true
      # Merged over the chart's config, which keeps its inhibit rules.
      config:
        global:
          smtp_smarthost: smtp.resend.com:587
          smtp_from: home-cluster <alerts@infra.davidapps.dev>
          smtp_auth_username: resend
          # Send-only Resend key for infra.davidapps.dev.
          smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-resend/api-key
          smtp_require_tls: true
        route:
          receiver: email
          group_by: ["alertname", "namespace"]
          routes:
            - receiver: "null"
              matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
            - receiver: "null"
              matchers: ['severity =~ "info|none"']
        receivers:
          - name: "null"
          - name: email
            email_configs:
              - to: david@davidilie.com
                send_resolved: true
      alertmanagerSpec:
        secrets: ["alertmanager-resend"]
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
    kubeApiServer:
      serviceMonitor:
        selector:
          k8s-app: kube-apiserver
    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
    kubeControllerManager: &kubeControllerManager
      service:
        selector:
          k8s-app: kube-controller-manager
    kubeEtcd:
      <<: *kubeControllerManager
    kubeProxy:
      enabled: false
    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        externalLabels:
          cluster: home-cluster
        # Cap head/TSDB growth so memory cannot creep past the limit again.
        retention: 14d
        retentionSize: 8GB
        # Persist the TSDB; on emptyDir every restart wiped 14d of data and
        # ate up to 8GB of the Talos EPHEMERAL partition.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: openebs-hostpath
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 20Gi
        remoteWrite:
          - url: "http://prometheus-home-cluster.observability.svc.cluster.local:9090/api/v1/write"
        resources:
          requests:
            cpu: 100m
            memory: 3Gi
          limits:
            memory: 12Gi
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      # Desired and ready instances of every CNPG Cluster, for
      # PostgresClusterDown in prometheusrule.yaml.
      rbac:
        extraRules:
          - apiGroups: ["postgresql.cnpg.io"]
            resources: ["clusters"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Cluster
                metricNamePrefix: kube_cnpg_cluster
                labelsFromPath:
                  namespace: [metadata, namespace]
                  cluster: [metadata, name]
                metrics:
                  - name: instances
                    help: Instances the CNPG Cluster asks for.
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, instances]
                  - name: ready_instances
                    help: Ready instances of the CNPG Cluster.
                    each:
                      type: Gauge
                      gauge:
                        path: [status, readyInstances]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      enabled: false
      forceDeployDashboards: false
