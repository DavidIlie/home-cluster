# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-davidapps-cluster
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      prometheus:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: prom/prometheus
              tag: v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
              pullPolicy: IfNotPresent
            args:
              - "--config.file=/etc/prometheus/prometheus.yml"
              - "--storage.tsdb.path=/prometheus_data"
              - "--web.enable-remote-write-receiver"
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /-/healthy
                    port: &port 9090
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              privileged: true
    persistence:
      config:
        type: configMap
        name: prometheus-davidapps-cluster-config
        globalMounts:
          - path: /etc/prometheus/prometheus.yml
            subPath: config.yml
            readOnly: true
      data:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/mdadm-analytics-storage/prometheus/davidapps-cluster/data
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /prometheus_data
    ingress:
      prometheus:
        enabled: true
        className: internal
        annotations:
          # NOTE: the hostname's DNS record is owned by the LoadBalancer Service below
          # (external-dns hostname annotation -> 192.168.100.95), not by this Ingress,
          # so the reachable URL is http on :9090 rather than https on :443.
          gatus.home-operations.com/endpoint: |-
            name: Prometheus (davidapps-cluster)
            group: Monitoring
            url: http://prometheus-davidapps.davidhome.ro:9090/-/healthy
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &app prometheus-davidapps.davidhome.ro
            paths:
              - path: /
                service:
                  identifier: prometheus
                  port: http
        tls:
          - hosts:
              - *app
    service:
      prometheus:
        controller: prometheus
        type: LoadBalancer
        annotations:
          external-dns.alpha.kubernetes.io/hostname: prometheus-davidapps.davidhome.ro
          lbipam.cilium.io/ips: 192.168.100.95
        ports:
          http:
            port: *port
