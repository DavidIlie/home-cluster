apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-davidapps-web
  annotations:
    gatus.home-operations.com/enabled: "false"
    external-dns.alpha.kubernetes.io/controller: none
    external-dns.kubernetes.io/controller: none
spec:
  hostnames:
    - prometheus-davidapps.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus-davidapps-cluster
          port: 9090
