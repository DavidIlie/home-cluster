---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ./route.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: prometheus-uk-cluster-config
    files:
      - config.yml=./resources/config.yml
generatorOptions:
  disableNameSuffixHash: true
