---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-home-cluster
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Prometheus home (Envoy)
      group: Monitoring
      url: https://prometheus.davidhome.ro/-/healthy
      interval: 1m
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - prometheus.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: prometheus-home-cluster
          port: 9090
