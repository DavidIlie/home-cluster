# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-home-cluster
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      prometheus:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: prom/prometheus
              tag: v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
              pullPolicy: IfNotPresent
            args:
              - "--config.file=/etc/prometheus/prometheus.yml"
              - "--storage.tsdb.path=/prometheus_data"
              - "--web.enable-remote-write-receiver"
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 1000m
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &path /-/healthy
                    port: &port 9090
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              privileged: true
    persistence:
      config:
        type: configMap
        name: prometheus-home-cluster-config
        globalMounts:
          - path: /etc/prometheus/prometheus.yml
            subPath: config.yml
            readOnly: true
          - path: /etc/prometheus/rules/libertosRules.yaml
            subPath: libertosRules.yaml
            readOnly: true
      data:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/mdadm-analytics-storage/prometheus/home-cluster/data
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /prometheus_data
    ingress:
      prometheus:
        enabled: true
        className: internal
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Prometheus (home-cluster)
            group: Monitoring
            url: https://prometheus.davidhome.ro/-/healthy
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &app prometheus.davidhome.ro
            paths:
              - path: /
                service:
                  identifier: prometheus
                  port: http
        tls:
          - hosts:
              - *app
    service:
      prometheus:
        controller: prometheus
        ports:
          http:
            port: *port
