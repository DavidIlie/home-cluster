apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-kidays
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: grafana-kidays (Envoy)
      group: Monitoring
      url: https://kidays-monitoring.davidapps.dev/api/health
      interval: 1m
      client:
        dns-resolver: tcp://1.1.1.1:53
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - kidays-monitoring.davidapps.dev
  parentRefs:
    - name: envoy-grafana
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: grafana-kidays
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-kidays-live
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - kidays-monitoring.davidapps.dev
  parentRefs:
    - name: envoy-grafana
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/live/ws
          method: GET
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: grafana-kidays
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: grafana-kidays-request-limit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-kidays
  mergeType: StrategicMerge
  requestBuffer:
    mode: BufferAndLimit
    limit: 1Mi
