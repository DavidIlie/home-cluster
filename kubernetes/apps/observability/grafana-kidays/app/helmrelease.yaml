---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# Dedicated Kidays developer Grafana (OSS). It shows only the reviewed
# Apps / Kidays dashboards and has no direct datasource: every query goes to
# kidays-query-gateway, which forwards only byte-identical dashboard templates.
# Explore, editing, alerting, snapshots, and public dashboards are off, but
# those are UX; the gateway is the control. See davidapps-auth
# docs/runbooks/query-gateway.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-kidays
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: grafana-kidays
    nameOverride: grafana-kidays
    image:
      tag: 12.3.10
      # The chart prefixes this field with `sha256:` when composing the image.
      sha: 91032506559aa7477105b5835c5a17475b4909635fbe240bd6aff50512717a5b
    deploymentStrategy:
      type: Recreate
    # openebs-hostpath does not apply fsGroup, so the data directory is chowned
    # once at start. Reuse the pinned Grafana image (it ships chown) instead of
    # the chart's unpinned busybox default.
    initChownData:
      enabled: true
      image:
        registry: docker.io
        repository: grafana/grafana
        tag: 12.3.10
        sha: 91032506559aa7477105b5835c5a17475b4909635fbe240bd6aff50512717a5b
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN"]
    rbac:
      create: false
    serviceAccount:
      create: true
      automountServiceAccountToken: false
    automountServiceAccountToken: false
    enableServiceLinks: false
    # Grafana answers /api/health before the background plugin install
    # finishes, so the pod is Ready only when the pinned plugin is on disk at
    # exactly 0.32.0, registered public assets, and a healthy API. Liveness stays the chart's
    # /api/health check, so an install in progress never restarts the pod.
    readinessProbe:
      httpGet: null
      exec:
        command:
          - sh
          - -c
          - >-
            grep -Eq '"id"[[:space:]]*:[[:space:]]*"victoriametrics-logs-datasource"'
            /var/lib/grafana/plugins/victoriametrics-logs-datasource/plugin.json
            && grep -Eq '"version"[[:space:]]*:[[:space:]]*"0\.32\.0"'
            /var/lib/grafana/plugins/victoriametrics-logs-datasource/plugin.json
            && timeout 5 wget -q -O /dev/null
            http://127.0.0.1:3000/public/plugins/victoriametrics-logs-datasource/module.js
            && timeout 5 wget -q -O /dev/null http://127.0.0.1:3000/api/health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 12
      failureThreshold: 3
    resources:
      requests:
        cpu: 25m
        memory: 192Mi
      limits:
        memory: 512Mi
    admin:
      # Recovery only: the login form and basic auth are disabled below. The
      # value was generated by the audited SOPS mover and never displayed.
      existingSecret: grafana-kidays-admin-secret
      userKey: admin-user
      passwordKey: admin-password
    env:
      GF_SERVER_ROOT_URL: "https://kidays-monitoring.davidapps.dev"
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-kidays-oidc-secret
          key: client-id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-kidays-oidc-secret
          key: client-secret
      # Presented to the gateway on every datasource call from the Grafana
      # server. It never reaches the browser.
      KIDAYS_QUERY_GATEWAY_BEARER:
        secretKeyRef:
          name: kidays-query-gateway-secret
          key: bearer.token
    grafana.ini:
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
        feedback_links_enabled: false
      news:
        news_feed_enabled: false
      auth:
        disable_login_form: true
        oauth_allow_insecure_email_lookup: false
        # Revocation bound, not per-request revocation. Grafana v12.3.10
        # LookupToken expires a session when created_at is older than
        # login_maximum_lifetime_duration, and token rotation never moves
        # created_at. A revoked person therefore keeps access for up to
        # 10 minutes plus any request already running; auto_login then
        # re-runs the DavidApps authorization, which checks the grafana-kidays
        # grant again.
        login_maximum_lifetime_duration: 10m
        login_maximum_inactive_lifetime_duration: 10m
        token_rotation_interval_minutes: 2
      auth.basic:
        enabled: false
      auth.anonymous:
        enabled: false
      auth.generic_oauth:
        name: DavidApps
        enabled: true
        # Grafana creates the account on first login; who may log in at all is
        # decided by the closed grafana-kidays DavidApps application.
        allow_sign_up: true
        auto_login: true
        auth_url: https://id.davidapps.dev/api/auth/oauth2/authorize
        token_url: https://id.davidapps.dev/api/auth/oauth2/token
        api_url: https://id.davidapps.dev/api/auth/oauth2/userinfo
        scopes: "openid profile email offline_access"
        auth_style: InHeader
        use_pkce: true
        use_refresh_token: true
        validate_id_token: true
        jwk_set_url: https://id.davidapps.dev/api/auth/jwks
        login_attribute_path: sub
        name_attribute_path: name
        email_attribute_path: email
        # Everyone is Viewer, the owner included. Nothing here is edited in
        # the UI; dashboards and datasources are provisioned from Git.
        role_attribute_path: "'Viewer'"
        role_attribute_strict: true
        allow_assign_grafana_admin: false
        skip_org_role_sync: false
      users:
        allow_sign_up: false
        allow_org_create: false
        auto_assign_org: true
        auto_assign_org_role: Viewer
        viewers_can_edit: false
        editors_can_admin: false
      explore:
        enabled: false
      public_dashboards:
        enabled: false
      snapshots:
        enabled: false
        external_enabled: false
      unified_alerting:
        enabled: false
      live:
        max_connections: 0
      feature_toggles:
        sqlExpressions: false
      plugins:
        # Asynchronous on purpose. In Grafana v12.3.10 the plugin installer
        # service is disabled whenever the async list is empty
        # (pkg/services/pluginsintegration/plugininstaller/service.go
        # IsDisabled), so a preinstall_sync entry alone installs nothing once
        # disable_plugins has removed every default. This exact version is
        # the only async entry; disable_plugins removes the default
        # drilldown/advisor apps so nothing else is fetched or offered. The
        # install lands on the persistent plugins directory and is skipped on
        # later starts when 0.32.0 is already present. Readiness below waits
        # for it.
        preinstall: victoriametrics-logs-datasource@0.32.0
        disable_plugins: grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,grafana-advisor-app,grafana-pathfinder-app
        plugin_admin_enabled: false
        public_key_retrieval_disabled: true
      security:
        cookie_secure: true
        cookie_samesite: lax
        disable_gravatar: true
      dashboards:
        min_refresh_interval: 30s
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          # Same uids as the dashboard JSON; each points at the gateway route
          # for that uid and kind. The gateway, not these entries, decides
          # which queries run.
          - name: prometheus-davidapps-cluster
            type: prometheus
            uid: prometheus-davidapps-cluster
            access: proxy
            editable: false
            url: http://kidays-query-gateway.observability.svc.cluster.local:8080/ds/prometheus-davidapps-cluster
            isDefault: true
            jsonData:
              httpMethod: POST
              timeInterval: 15s
              prometheusType: Prometheus
              httpHeaderName1: Authorization
            secureJsonData:
              httpHeaderValue1: "Bearer ${KIDAYS_QUERY_GATEWAY_BEARER}"
          - name: prometheus-home-cluster
            type: prometheus
            uid: prometheus-home-cluster
            access: proxy
            editable: false
            url: http://kidays-query-gateway.observability.svc.cluster.local:8080/ds/prometheus-home-cluster
            isDefault: false
            jsonData:
              httpMethod: POST
              timeInterval: 15s
              prometheusType: Prometheus
              httpHeaderName1: Authorization
            secureJsonData:
              httpHeaderValue1: "Bearer ${KIDAYS_QUERY_GATEWAY_BEARER}"
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            uid: victoria-logs
            access: proxy
            editable: false
            url: http://kidays-query-gateway.observability.svc.cluster.local:8080/ds/victoria-logs
            isDefault: false
            jsonData:
              maxLines: "1000"
              httpHeaderName1: Authorization
            secureJsonData:
              httpHeaderValue1: "Bearer ${KIDAYS_QUERY_GATEWAY_BEARER}"
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: apps-kidays
            orgId: 1
            folder: Apps / Kidays
            # Same folder uid as the shared Grafana; no migration.
            folderUid: afv5x41dfcw00c
            type: file
            disableDeletion: true
            allowUiUpdates: false
            editable: false
            options:
              path: /var/lib/grafana/dashboards/apps-kidays
    dashboardsConfigMaps:
      apps-kidays: grafana-kidays-dashboards
    sidecar:
      dashboards:
        enabled: false
      datasources:
        enabled: false
    serviceMonitor:
      enabled: false
    ingress:
      enabled: true
      ingressClassName: external
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "1m"
      hosts: ["kidays-monitoring.davidapps.dev"]
    persistence:
      enabled: true
      type: pvc
      storageClassName: openebs-hostpath
      accessModes:
        - ReadWriteOnce
      size: 1Gi
    testFramework:
      enabled: false
