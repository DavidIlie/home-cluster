# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plausible
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      plausible:
        strategy: RollingUpdate
        annotations:
          # NOTE: this used to say `plausible-envs`, a Secret that has never
          # existed, so reloader silently never restarted this Deployment on a
          # credential change. The Secret actually consumed via envFrom below
          # is `plausible-secret`.
          secret.reloader.stakater.com/reload: plausible-secret,plausible-employee-hub-reader-secret
          configmap.reloader.stakater.com/reload: plausible-employee-hub-reader-sql
        initContainers:
          employee-hub-reader:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 17.2-32@sha256:b17d21f8ec36add9b3c0ea3fb354d05f62a8fddf8ba65ae94e63ba77bc42202e
            command: ["sh", "-ec"]
            args:
              - |
                export PGDATABASE="$DATABASE_URL"
                psql --variable=ON_ERROR_STOP=1 --file=/bootstrap/employee-hub-reader.sql
            env:
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: plausible-secret
                    key: DATABASE_URL
              PLAUSIBLE_READER_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: plausible-employee-hub-reader-secret
                    key: PLAUSIBLE_READER_PASSWORD
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/plausible/community-edition
              tag: v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
              pullPolicy: IfNotPresent
            command:
              - sh
              - -c
              - |
                set -eux
                /entrypoint.sh db createdb
                /entrypoint.sh db migrate
                exec /entrypoint.sh run
            env:
              BASE_URL: https://plausible.davidapps.dev
              DISABLE_REGISTRATION: invite_only
              IP_GEOLOCATION_DB: /usr/share/GeoIP/GeoLite2-City.mmdb
            envFrom:
              - secretRef:
                  name: plausible-secret
            probes:
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 50m
                memory: 768Mi
        pod:
          terminationGracePeriodSeconds: 1
          securityContext:
            runAsNonRoot: true
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            supplementalGroups: [10000]
            seccompProfile: { type: RuntimeDefault }
    persistence:
      employee-hub-reader-sql:
        type: configMap
        name: plausible-employee-hub-reader-sql
        advancedMounts:
          plausible:
            employee-hub-reader:
              - path: /bootstrap/employee-hub-reader.sql
                subPath: employee-hub-reader.sql
                readOnly: true
      tmp:
        enabled: true
        type: emptyDir
      geoip:
        existingClaim: geoip-nfs
        globalMounts:
          - path: /usr/share/GeoIP
            readOnly: true
    service:
      plausible:
        controller: plausible
        ports:
          http:
            port: 8000
    ingress:
      plausible:
        enabled: true
        className: external
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Monitoring
          gethomepage.dev/name: Plausible
          gethomepage.dev/icon: plausible.png
          gethomepage.dev/description: Web Analytics
          gatus.home-operations.com/endpoint: |-
            name: Plausible
            group: Monitoring
            url: https://plausible.davidapps.dev
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &app plausible.davidapps.dev
            paths:
              - path: /
                service:
                  identifier: plausible
                  port: http
      metrics:
        enabled: true
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.davidhome.ro"
          # GET on the ingest path is answered by Plausible itself with 404
          # (it only accepts POST) - proves the ingress reaches the app.
          gatus.home-operations.com/endpoint: |-
            name: Plausible Events
            group: Monitoring
            url: https://e.davidhome.ro/api/event
            interval: 1m
            conditions: ["[STATUS] == 404"]
        hosts:
          - host: &events e.davidhome.ro
            paths:
              - path: /api/event
                service:
                  identifier: plausible
                  port: http
          - host: &eventsgurt e.gurt.ing
            paths:
              - path: /api/event
                service:
                  identifier: plausible
                  port: http
      backupevents:
        enabled: true
        className: external
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: Plausible Events (Backup)
            group: Monitoring
            url: https://e.dave.tips/api/event
            interval: 1m
            conditions: ["[STATUS] == 404"]
        hosts:
          - host: &backupevents e.dave.tips
            paths:
              - path: /api/event
                service:
                  identifier: plausible
                  port: http
      manualscript:
        enabled: true
        className: external
        annotations:
          nginx.ingress.kubernetes.io/use-regex: "true"
          nginx.ingress.kubernetes.io/rewrite-target: /js/script.manual.revenue.js
          gatus.home-operations.com/endpoint: |-
            name: Plausible Script (Manual)
            group: Monitoring
            url: https://manualjs.dave.tips/
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &manual manualjs.dave.tips
            paths:
              - path: /(.*)
                pathType: ImplementationSpecific
                service:
                  identifier: plausible
                  port: http
      script:
        enabled: true
        className: external
        annotations:
          nginx.ingress.kubernetes.io/use-regex: "true"
          nginx.ingress.kubernetes.io/rewrite-target: /js/script.file-downloads.outbound-links.pageview-props.revenue.tagged-events.js
          gatus.home-operations.com/endpoint: |-
            name: Plausible Script
            group: Monitoring
            url: https://js.dave.tips/
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &script js.dave.tips
            paths:
              - path: /(.*)
                pathType: ImplementationSpecific
                service:
                  identifier: plausible
                  port: http
        tls:
          - hosts:
              - *app
              - *events
              - *backupevents
              - *manual
              - *script
              - *eventsgurt
