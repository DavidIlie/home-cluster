# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-3.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plausible-clickhouse
  namespace: observability
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      clickhouse:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: clickhouse/clickhouse-server
              tag: 26.8.2.7-alpine@sha256:8f1dd1ec7213410276c8e9aee11b25b458fe9d53eee13ad8cfdf7c79e36aad17
              pullPolicy: IfNotPresent
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: &path /ping
                    port: &port 8123
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              privileged: true
            ports:
              - name: http
                containerPort: 8123
                protocol: TCP
              - name: metrics
                containerPort: 9363
                protocol: TCP
            # Was BestEffort with an empty resources block — 132 restarts with
            # exit 137. The limit also caps ClickHouse's own cgroup-derived
            # max_server_memory_usage instead of it sizing against node RAM.
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
    persistence:
      event-data:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/mdadm-analytics-storage/plausible/event-data
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/lib/clickhouse
      event-logs:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/mdadm-analytics-storage/plausible/event-logs
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/log/clickhouse-server
      users-config:
        enabled: true
        type: configMap
        name: plausible-clickhouse-users
        globalMounts:
          - path: /etc/clickhouse-server/users.d/users.xml
            subPath: users.xml
      server-config:
        type: configMap
        name: plausible-clickhouse-config
        globalMounts:
          - path: /etc/clickhouse-server/config.d/disable-logs.xml
            subPath: disable-logs.xml
            readOnly: true
          - path: /etc/clickhouse-server/config.d/prometheus.xml
            subPath: prometheus.xml
            readOnly: true
    service:
      clickhouse:
        controller: clickhouse
        ports:
          http:
            port: 8123
          metrics:
            port: 9363
    serviceMonitor:
      clickhouse:
        serviceName: plausible-clickhouse
        endpoints:
          - port: metrics
            path: /metrics
            interval: 1m
