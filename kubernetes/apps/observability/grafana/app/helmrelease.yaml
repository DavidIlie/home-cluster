---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      tag: 12.3.10
      # The chart prefixes this field with `sha256:` when composing the image.
      sha: 91032506559aa7477105b5835c5a17475b4909635fbe240bd6aff50512717a5b
    deploymentStrategy:
      type: Recreate
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
    admin:
      existingSecret: grafana-admin-secret
    env:
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      GF_EXPLORE_ENABLED: true
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel
      GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
      GF_SERVER_ROOT_URL: "https://monitoring.davidapps.dev"
    envValueFrom:
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
        secretKeyRef:
          name: grafana-oidc-secret
          key: client-id
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
        secretKeyRef:
          name: grafana-oidc-secret
          key: client-secret
    grafana.ini:
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      auth:
        disable_login_form: false
      auth.basic:
        enabled: true
      auth.generic_oauth:
        name: DavidApps
        enabled: true
        allow_sign_up: true
        # DavidApps is the normal path; /login?disableAutoLogin=true keeps the
        # local admin form available as a documented break-glass recovery.
        auto_login: true
        auth_url: https://id.davidapps.dev/api/auth/oauth2/authorize
        token_url: https://id.davidapps.dev/api/auth/oauth2/token
        api_url: https://id.davidapps.dev/api/auth/oauth2/userinfo
        scopes: "openid profile email offline_access"
        auth_style: InHeader
        use_pkce: true
        use_refresh_token: true
        validate_id_token: true
        jwk_set_url: https://id.davidapps.dev/api/auth/jwks
        login_attribute_path: sub
        name_attribute_path: name
        email_attribute_path: email
        skip_org_role_sync: true
      feature_toggles:
        # Keep the SQL Expressions execution surface off even on patched
        # versions; this instance does not use it.
        sqlExpressions: false
      news:
        news_feed_enabled: false
      security:
        cookie_secure: true
        cookie_samesite: lax
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: prometheus-davidapps-cluster
            type: prometheus
            uid: prometheus-davidapps-cluster
            access: proxy
            url: http://prometheus-davidapps-cluster.observability.svc.cluster.local:9090
            jsonData:
              timeInterval: 15s
            isDefault: false
          - name: prometheus-home-cluster
            type: prometheus
            uid: prometheus-home-cluster
            access: proxy
            url: http://prometheus-home-cluster.observability.svc.cluster.local:9090
            jsonData:
              timeInterval: 15s
            isDefault: false
          - name: prometheus-kube-stack
            type: prometheus
            uid: prometheus-kube-stack
            access: proxy
            url: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            jsonData:
              timeInterval: 15s
            isDefault: false
          - name: VictoriaLogs
            type: victoriametrics-logs-datasource
            uid: victoria-logs
            access: proxy
            url: http://victoria-logs-server.observability.svc.cluster.local:9428
            jsonData:
              derivedFields:
                - name: trace_id
                  matcherType: label
                  matcherRegex: trace_id
                  url: '${__value.raw}'
                  urlDisplayLabel: View trace
                  datasourceUid: tempo
            isDefault: false
          - name: Tempo
            type: tempo
            uid: tempo
            access: proxy
            url: http://tempo.observability.svc.cluster.local:3200
            jsonData:
              tracesToLogsV2:
                datasourceUid: victoria-logs
                spanStartTimeShift: -1m
                spanEndTimeShift: 1m
                filterByTraceID: false
                filterBySpanID: false
                customQuery: true
                query: 'trace_id:="${__trace.traceId}"'
              nodeGraph:
                enabled: true
              search:
                hide: false
              traceQuery:
                timeShiftEnabled: true
            isDefault: false
    alerting:
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: physical-network-health
            folder: CI / GitHub Actions
            interval: 1m
            rules:
              - uid: davidapps_node_rx_error_ratio
                title: Davidapps node RX error ratio
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus-davidapps-cluster
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus-davidapps-cluster
                      editorMode: code
                      expr: >-
                        (100 * sum by(kubernetes_node,device) (increase(node_network_receive_errs_total{cluster="davidapps-cluster",device=~"eno1|eno2"}[5m])) / clamp_min(sum by(kubernetes_node,device) (increase(node_network_receive_packets_total{cluster="davidapps-cluster",device=~"eno1|eno2"}[5m])) + sum by(kubernetes_node,device) (increase(node_network_receive_errs_total{cluster="davidapps-cluster",device=~"eno1|eno2"}[5m])), 1)) and on(kubernetes_node,device) sum by(kubernetes_node,device) (increase(node_network_receive_errs_total{cluster="davidapps-cluster",device=~"eno1|eno2"}[5m])) >= 10 and on(kubernetes_node,device) sum by(kubernetes_node,device) (increase(node_network_receive_packets_total{cluster="davidapps-cluster",device=~"eno1|eno2"}[5m])) >= 300
                      instant: true
                      intervalMs: 15000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [B]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      reducer: last
                      refId: B
                      type: reduce
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: [0.001]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [C]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                      type: threshold
                dashboardUid: github-actions-runner-fleet
                panelId: 64
                noDataState: OK
                execErrState: Error
                for: 2m
                annotations:
                  __dashboardUid__: github-actions-runner-fleet
                  __panelId__: "64"
                  summary: A physical 10 GbE member is accumulating receive errors above the permitted ratio.
                labels:
                  service: physical-network
                  severity: warning
                isPaused: false
              - uid: unifi_aggregation_rx_errors
                title: UniFi aggregation RX errors
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: prometheus-home-cluster
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus-home-cluster
                      editorMode: code
                      expr: >-
                        sum by(port_num,port_name) (increase(unpoller_device_port_receive_errors_total{job="unifipoller",name="USW-Pro-Aggregation",port_num=~"9|11|13|15|17|19"}[5m]))
                      instant: true
                      intervalMs: 15000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [B]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      reducer: last
                      refId: B
                      type: reduce
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: [9]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [C]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                      type: threshold
                dashboardUid: github-actions-runner-fleet
                panelId: 65
                noDataState: OK
                execErrState: Error
                for: 2m
                annotations:
                  __dashboardUid__: github-actions-runner-fleet
                  __panelId__: "65"
                  summary: A davidapps aggregation member accumulated at least 10 receive errors in five minutes.
                labels:
                  service: physical-network
                  severity: critical
                isPaused: false
              - uid: unifi_aggregation_low_rx_power
                title: UniFi aggregation low RX power
                condition: C
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: prometheus-home-cluster
                    model:
                      datasource:
                        type: prometheus
                        uid: prometheus-home-cluster
                      editorMode: code
                      expr: >-
                        min by(port_num,port_name,sfp_vendor,sfp_part) (unpoller_device_port_sfp_rx_power{job="unifipoller",name="USW-Pro-Aggregation",port_num=~"9|11|13|15|17|19"})
                      instant: true
                      intervalMs: 15000
                      legendFormat: __auto
                      maxDataPoints: 43200
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: []
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [B]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: A
                      intervalMs: 1000
                      maxDataPoints: 43200
                      reducer: last
                      refId: B
                      type: reduce
                  - refId: C
                    datasourceUid: __expr__
                    model:
                      conditions:
                        - evaluator:
                            params: [-9.9]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [C]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: __expr__
                      expression: B
                      intervalMs: 1000
                      maxDataPoints: 43200
                      refId: C
                      type: threshold
                dashboardUid: github-actions-runner-fleet
                panelId: 66
                noDataState: Alerting
                execErrState: Error
                for: 5m
                annotations:
                  __dashboardUid__: github-actions-runner-fleet
                  __panelId__: "66"
                  summary: A davidapps aggregation optic is below the 10GBASE-SR minimum average receive power.
                labels:
                  service: physical-network
                  severity: warning
                isPaused: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: network-unifi
            orgId: 1
            folder: Network / UniFi
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network-unifi
          - name: network-kubernetes
            orgId: 1
            folder: Network / Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network-kubernetes
          - name: infrastructure-hosts
            orgId: 1
            folder: Infrastructure / Hosts
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure-hosts
          - name: infrastructure-storage
            orgId: 1
            folder: Infrastructure / Storage
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure-storage
          - name: infrastructure-databases
            orgId: 1
            folder: Infrastructure / Databases
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure-databases
          - name: observability-platform
            orgId: 1
            folder: Observability / Platform
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/observability-platform
          - name: ai-operations
            orgId: 1
            folder: AI / Operations
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/ai-operations
          - name: apps-fleet
            orgId: 1
            folder: Apps / Fleet
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps-fleet
          - name: apps-zerocut
            orgId: 1
            folder: Apps / ZeroCut
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps-zerocut
          - name: apps-mbretrofit
            orgId: 1
            folder: Apps / MB Retrofit
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps-mbretrofit
          - name: apps-kidays
            orgId: 1
            folder: Apps / Kidays
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps-kidays
          - name: telemetry-platform
            orgId: 1
            folder: Observability / Telemetry
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/telemetry-platform
          - name: github-actions
            orgId: 1
            folder: CI / GitHub Actions
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/github-actions
    dashboards:
      network-unifi:
        access-points:
          # renovate: depName="UniFi-Poller: UAP Insights - Prometheus"
          gnetId: 11314
          revision: 10
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
        clients:
          # renovate: depName="UniFi-Poller: Client Insights - Prometheus"
          gnetId: 11315
          revision: 9
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
        switches:
          # renovate: depName="UniFi-Poller: USW Insights - Prometheus"
          gnetId: 11312
          revision: 9
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
        sites:
          # renovate: depName="UniFi-Poller: Network Sites - Prometheus"
          gnetId: 11311
          revision: 5
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
        gateways:
          # renovate: depName="UniFi-Poller: USG Insights - Prometheus"
          gnetId: 11313
          revision: 9
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
        client-dpi:
          # renovate: depName="UniFi-Poller: Client DPI - Prometheus"
          gnetId: 11310
          revision: 5
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
      kubernetes:
        api-server:
          # renovate: depName="Kubernetes / System / API Server"
          gnetId: 15761
          revision: 18
          datasource: prometheus-davidapps-cluster
        persistent-volumes:
          # renovate: depName="kubernetes-persistent-volumes"
          gnetId: 13646
          revision: 2
          datasource: prometheus-davidapps-cluster
        coredns:
          # renovate: depName="Kubernetes / System / CoreDNS"
          gnetId: 15762
          revision: 19
          datasource: prometheus-davidapps-cluster
        cluster:
          # renovate: depName="Kubernetes / Views / Global"
          gnetId: 15757
          revision: 42
          datasource: prometheus-davidapps-cluster
        namespaces:
          # renovate: depName="Kubernetes / Views / Namespaces"
          gnetId: 15758
          revision: 41
          datasource: prometheus-davidapps-cluster
        nodes:
          # renovate: depName="Kubernetes / Views / Nodes"
          gnetId: 15759
          revision: 32
          datasource: prometheus-davidapps-cluster
        pods:
          # renovate: depName="Kubernetes / Views / Pods"
          gnetId: 15760
          revision: 34
          datasource: prometheus-davidapps-cluster
        summary:
          # renovate: depName="Kubernetes / Views / K3s Cluster"
          gnetId: 16450
          revision: 3
          datasource: prometheus-davidapps-cluster
        pod-logs:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/kubernetes-pod-logs.json
          datasource: VictoriaLogs
      network-kubernetes:
        cloudflare-tunnels:
          # renovate: depName="Flux2"
          gnetId: 17457
          revision: 6
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-davidapps-cluster }
        ingress-nginx:
          url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/nginx.json
          datasource: prometheus-davidapps-cluster
        request-handling:
          url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/request-handling-performance.json
          datasource: prometheus-davidapps-cluster
        cilium:
          # renovate: depName="Cilium Metrics"
          gnetId: 22126
          revision: 1
          datasource: prometheus-davidapps-cluster
      infrastructure-hosts:
        proxmox:
          # renovate: depName="Proxmox via Prometheus"
          gnetId: 10347
          revision: 5
          datasource:
            - { name: DS_PROMETHEUS, value: prometheus-home-cluster }
        idrac:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/idrac.json
          datasource: prometheus-home-cluster
        node-disks:
          # renovate: depName="node-exporter disk graphs"
          gnetId: 9852
          revision: 1
          datasource: prometheus-davidapps-cluster
        nodes:
          # renovate: depName="Node Exporter Full"
          gnetId: 1860
          revision: 37
          datasource: prometheus-davidapps-cluster
        gpu:
          # renovate: depName="NVIDIA DCGM Exporter Dashboard"
          gnetId: 12239
          revision: 2
          datasource: prometheus-home-cluster
      infrastructure-storage:
        truenas:
          url: https://raw.githubusercontent.com/Supporterino/truenas-graphite-to-prometheus/main/dashboards/truenas_scale.json
          datasource: prometheus-home-cluster
        truenas-disks:
          url: https://raw.githubusercontent.com/Supporterino/truenas-graphite-to-prometheus/main/dashboards/truenas_scale_disk_insights.json
          datasource: prometheus-home-cluster
        truenas-temperatures:
          url: https://raw.githubusercontent.com/Supporterino/truenas-graphite-to-prometheus/main/dashboards/truenas_scale_temperatures.json
          datasource: prometheus-home-cluster
        analytics:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/analytics-storage.json
          datasource: prometheus-kube-stack
      infrastructure-databases:
        dragonfly:
          url: https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/v1.1.8/monitoring/grafana-dashboard.json
          datasource: prometheus-davidapps-cluster
        cloudnativepg:
          # renovate: depName="CloudNativePG"
          gnetId: 20417
          revision: 3
          datasource: prometheus-davidapps-cluster
      observability-platform:
        prometheus:
          # renovate: depName="Prometheus"
          gnetId: 19105
          revision: 6
          datasource: prometheus-home-cluster
      ai-operations:
        cliproxy:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/cliproxy-usage.json
          datasource: prometheus-home-cluster
      apps-fleet:
        overview:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/apps-fleet.json
      apps-zerocut:
        overview:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/zerocut-overview.json
        revenue:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/zerocut-revenue.json
        reliability:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/zerocut-reliability.json
        browser:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/zerocut-browser.json
        runtime:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/zerocut-runtime.json
      apps-mbretrofit:
        overview:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/mbretrofit-overview.json
      apps-kidays:
        overview:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/kidays-overview.json
      telemetry-platform:
        overview:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/telemetry-platform.json
      github-actions:
        runner-fleet:
          url: https://raw.githubusercontent.com/davidilie/home-cluster/main/kubernetes/apps/observability/grafana/app/dashboards/github-actions-runner-fleet.json
    sidecar:
      dashboards:
        enabled: false
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: false
        searchNamespace: ALL
        labelValue: ""
    plugins:
      - grafana-clock-panel
      - grafana-piechart-panel
      - grafana-worldmap-panel
      - natel-discrete-panel
      - vonage-status-panel
      - victoriametrics-logs-datasource
    serviceMonitor:
      enabled: true
    ingress:
      enabled: true
      ingressClassName: external
      annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "10m"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Monitoring
        gethomepage.dev/name: Grafana
        gethomepage.dev/icon: grafana.png
        gethomepage.dev/description: Observability Dashboard
        gatus.home-operations.com/endpoint: |-
          name: Grafana
          group: Monitoring
          url: https://monitoring.davidapps.dev
          interval: 1m
          conditions: ["[STATUS] == 200"]
      hosts: ["monitoring.davidapps.dev"]
    persistence:
      enabled: true
      type: pvc
      storageClassName: openebs-hostpath
      accessModes:
        - ReadWriteOnce
      size: 5Gi
    testFramework:
      enabled: false
