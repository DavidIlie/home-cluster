---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./claude-quota-exporter.yaml
  - ./servicemonitors.yaml
configMapGenerator:
  - name: cliproxy-claude-quota-exporter-script
    files:
      - exporter.py=./claude_quota_exporter.py
generatorOptions:
  disableNameSuffixHash: true
