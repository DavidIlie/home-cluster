# =============================================================================
#  SOPS-encrypted. Holds a copy of `remote-management.secret-key` from
#  kubernetes/apps/default/cliproxy/app/secret.sops.yaml.
#
#  WHY A DUPLICATE: Kubernetes Secrets are namespace-scoped. The exporter runs
#  in `observability`; the real key lives in a Secret in `default`. There is no
#  cross-namespace Secret reference, and the cliproxy app directory is owned by
#  another process and must not be touched. Rotating the management key
#  therefore requires editing BOTH SOPS files. If they drift, the exporter gets
#  401 -> json_exporter returns HTTP 503 -> `up == 0` (alert CLIProxyExporterDown
#  fires). This is a permanent, known operational coupling.
#
#  NOTE ON THE KEY NAME: the file must be named exactly `management-key`, because
#  the whole Secret is mounted as a DIRECTORY at /etc/cliproxy and the exporter
#  config points at `credentials_file: /etc/cliproxy/management-key`.
#  Do NOT switch this to a subPath mount: subPath mounts do not receive kubelet
#  secret updates, which would silently break rotation-without-restart.
# =============================================================================
