---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
spec:
  interval: 30m
  chart:
    spec:
      chart: tempo
      version: 3.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: tempo
    replicas: 1
    tempo:
      reportingEnabled: false
      retention: 168h
      queryFrontend:
        mcp_server:
          enabled: true
      metricsGenerator:
        enabled: true
        processor:
          service_graphs: {}
          span_metrics:
            enable_target_info: true
        registry:
          external_labels:
            telemetry_cluster: home-cluster
        storage:
          path: /var/tempo/metrics
          remote_write:
            - url: http://prometheus-home-cluster.observability.svc.cluster.local:9090/api/v1/write
              send_exemplars: true
      overrides:
        defaults:
          metrics_generator:
            processors:
              - service-graphs
              - span-metrics
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
    persistence:
      enabled: true
      storageClassName: tempo-analytics
      accessModes:
        - ReadWriteOnce
      size: 20Gi
    serviceAccount:
      automountServiceAccountToken: false
    serviceMonitor:
      enabled: true
      interval: 30s
