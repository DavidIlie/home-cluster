---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tempo-query
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Tempo (Envoy)
      group: Monitoring
      url: https://tempo.davidhome.ro/ready
      interval: 1m
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - tempo.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: tempo
          port: 3200
