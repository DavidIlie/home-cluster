---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-query
  annotations:
    external-dns.alpha.kubernetes.io/hostname: tempo.davidhome.ro
    external-dns.alpha.kubernetes.io/controller: none
    gatus.home-operations.com/enabled: "false"
spec:
  ingressClassName: internal
  rules:
    - host: &host tempo.davidhome.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempo
                port:
                  number: 3200
  tls:
    - hosts: [*host]
