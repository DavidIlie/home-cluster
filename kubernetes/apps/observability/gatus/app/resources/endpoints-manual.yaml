---
# Endpoints that cannot be discovered from an Ingress.
#
# IMPORTANT: gatus requires every (name, group) pair to be unique across this
# file AND every `gatus.home-operations.com/endpoint` Ingress annotation.
# A duplicate makes gatus panic on startup, so anything that has an annotated
# Ingress must NOT be repeated here.
endpoints:
  # Databases
  - name: Dragonfly
    group: Databases
    url: tcp://dragonfly.databases.svc.cluster.local:6379
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: PostgreSQL
    group: Databases
    url: tcp://postgres17-rw.databases.svc.cluster.local:5432
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Plausible ClickHouse
    group: Databases
    url: http://plausible-clickhouse.observability.svc.cluster.local:8123/ping
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: Zerocut ClickHouse
    group: Databases
    url: http://clickhouse.databases.svc.cluster.local:8123/ping
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  # Cluster
  - name: Kubernetes API
    group: Cluster
    url: https://kubernetes.default.svc.cluster.local:443
    client:
      insecure: true
    interval: 1m
    conditions:
      - "[STATUS] == any(200, 401, 403)"

  # Services with no Ingress at all
  - name: Agregarr
    group: Media
    url: http://agregarr.media.svc.cluster.local:7171/api/v1/status
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: FlareSolverr
    group: Downloads
    url: http://flaresolverr.downloads.svc.cluster.local:80/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: Ollama
    group: AI
    url: http://ollama.ai.svc.cluster.local:11434
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: SearXNG
    group: AI
    url: http://searxng.ai.svc.cluster.local:8080
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: Homepage
    group: Services
    url: http://homepage.default.svc.cluster.local:3000/api/healthcheck
    interval: 1m
    conditions:
      - "[STATUS] == 200"
