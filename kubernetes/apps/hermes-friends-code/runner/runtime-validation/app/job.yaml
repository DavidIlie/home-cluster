---
apiVersion: batch/v1
kind: Job
metadata:
  name: hermes-friends-kata-validation
  namespace: hermes-friends-runtime
  labels:
    app.kubernetes.io/name: hermes-friends-kata-validation
    hermes.davidapps.dev/activation-revision: friends-static-site-v1
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-friends-kata-validation
        hermes.davidapps.dev/activation-revision: friends-static-site-v1
    spec:
      runtimeClassName: kata-clh
      serviceAccountName: hermes-friends-runtime-validator
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: validate
          # The inert digest prevents accidental execution. Activation must
          # The digest is the locally built, reviewed Hermes runner image.
          image: ghcr.io/davidilie/hermes-friend-runner@sha256:47e4812c62b488841d1ba887bfbe385d59f6e3f3dc2e14edaed789bf931de4eb
          command: [/hermes-friend-runner]
          args: [runtime-validate, --runtime-class=kata-clh]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
