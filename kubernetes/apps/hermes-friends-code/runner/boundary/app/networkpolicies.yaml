        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hermes-friends-artifact
          podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-friend-artifactd
      ports:
        - port: 8081
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-api
  namespace: hermes-friends-creator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-friend-creator
  egress: &github-egress
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.github.com
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: github-api
  namespace: hermes-friends-publisher
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-friend-publisher
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.github.com
              - matchName: hermes-friend-artifactd.hermes-friends-artifact.svc.cluster.local
    - toFQDNs:
        - matchName: api.github.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-scrape
  namespace: hermes-friends-control
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-friend-dispatcher
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http:
              - method: GET
                path: ^/metrics$
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
