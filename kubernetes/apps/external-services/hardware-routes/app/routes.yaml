---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox-nucleus
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Proxmox (Envoy)
      group: Hardware
      url: https://nucleus.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == any(200, 302, 301)"]
spec:
  hostnames:
    - nucleus.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: proxmox-nucleus
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: proxmox-nucleus
spec:
  type: KubernetesService
  kubernetesService:
    name: proxmox-nucleus
    port: 8006
  tls:
    sni: nucleus.davidapps.local
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: proxmox-nucleus-ca
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmoxmenux-nucleus
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Proxmox Menux (Envoy)
      group: Hardware
      url: https://nucleus-menux.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == any(200, 302, 301)"]
spec:
  hostnames:
    - nucleus-menux.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: proxmox-nucleus
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: TrueNAS (Envoy)
      group: Infrastructure
      url: https://truenas.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == any(200, 302)"]
spec:
  hostnames:
    - truenas.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: truenas
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: truenas
spec:
  appProtocols:
    - gateway.envoyproxy.io/wss
  type: KubernetesService
  kubernetesService:
    name: truenas
    port: 443
  tls:
    alpnProtocols: ["http/1.1"]
    # Preserve the existing nginx policy for these self-signed appliance certificates.
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Unifi Controller (Envoy)
      group: Infrastructure
      url: https://unifi.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == any(200, 302, 301)"]
spec:
  hostnames:
    - unifi.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: unifi
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unifi
spec:
  type: KubernetesService
  kubernetesService:
    name: unifi
    port: 443
  tls:
    # Preserve the existing nginx policy for these self-signed appliance certificates.
    insecureSkipVerify: true

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: home-assistant
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Home Assistant (Envoy)
      group: Infrastructure
      url: https://hass.davidapps.dev
      interval: 1m
      client:
        dns-resolver: tcp://1.1.1.1:53
      conditions: ["[STATUS] == 200"]
spec:
  hostnames:
    - hass.davidhome.ro
    - hass.davidapps.dev
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%REQ(cf-connecting-ip)%"
      backendRefs:
        - name: home-assistant
          port: 8123
