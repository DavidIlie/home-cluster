  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: proxmox-nucleus
          port: 8008
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: TrueNAS (Envoy)
      group: Infrastructure
      url: https://truenas.davidhome.ro
      interval: 1m
      conditions: ["[STATUS] == any(200, 302)"]
spec:
  hostnames:
    - truenas.davidhome.ro
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: truenas
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: truenas
spec:
  appProtocols:
    - gateway.envoyproxy.io/wss
  type: KubernetesService
  kubernetesService:
    name: truenas
    port: 443
  tls:
    alpnProtocols: ["http/1.1"]
    # Preserve the existing nginx policy for these self-signed appliance certificates.
    insecureSkipVerify: true
