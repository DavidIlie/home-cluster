---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hardware-routes
  namespace: external-services
spec:
  targetNamespace: external-services
  commonMetadata:
    labels:
      app.kubernetes.io/name: hardware-routes
  dependsOn:
    - name: envoy-gateways
      namespace: network
  path: ./kubernetes/apps/external-services/hardware-routes/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
