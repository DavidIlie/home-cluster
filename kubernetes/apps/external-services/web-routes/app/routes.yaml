apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pelican-wings
  annotations:
    gatus.home-operations.com/enabled: "true"
    gatus.home-operations.com/endpoint: |-
      name: Pelican Wings (Envoy)
      group: Gaming
      url: https://pelican.davidhome.ro
      interval: 1m
      client:
        dns-resolver: tcp://1.1.1.1:53
      conditions: ["[STATUS] == 401"]
spec:
  hostnames:
    - pelican.davidhome.ro
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: pelican
          port: 8080
---
