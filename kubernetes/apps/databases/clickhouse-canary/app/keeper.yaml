---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: zerocut-canary-keeper
spec:
  defaults:
    storageManagement:
      provisioner: Operator
      reclaimPolicy: Retain
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: keeper-data
      serviceTemplate: keeper-service
  configuration:
    settings:
      logger/level: information
      logger/console: "true"
      listen_host: 0.0.0.0
      keeper_server/four_letter_word_white_list: ruok,conf,stat,mntr
      keeper_server/coordination_settings/raft_logs_level: information
      prometheus/endpoint: /metrics
      prometheus/port: "7000"
      prometheus/metrics: "true"
      prometheus/events: "true"
      prometheus/asynchronous_metrics: "true"
    clusters:
      - name: keeper
        pdbManaged: "true"
        pdbMaxUnavailable: 0
        layout:
          replicasCount: 1
  templates:
    podTemplates:
      - name: keeper
        metadata:
          labels:
            app.kubernetes.io/name: zerocut-canary-keeper
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/os: linux
          securityContext:
            fsGroup: 101
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:26.8@sha256:0fbe266b275a23b53508a7a3dac2e6fe149d63cddf242897a5c5c3d7b5350568
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
              volumeMounts:
                - name: keeper-data
                  mountPath: /var/lib/clickhouse-keeper
    volumeClaimTemplates:
      - name: keeper-data
        provisioner: Operator
        reclaimPolicy: Retain
        spec:
          storageClassName: openebs-hostpath
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    serviceTemplates:
      - name: keeper-service
        generateName: keeper-zerocut-canary
        spec:
          ports:
            - name: zk
              port: 2181
            - name: raft
              port: 9444
            - name: prometheus
              port: 7000
          type: ClusterIP
