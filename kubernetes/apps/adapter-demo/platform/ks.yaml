---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app adapter-demo-platform
  namespace: &namespace adapter-demo
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: *app
  dependsOn:
    - name: cloudnative-pg
      namespace: databases
    - name: openebs
      namespace: openebs-system
  path: ./kubernetes/apps/adapter-demo/platform/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
