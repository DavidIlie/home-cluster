apiVersion: v1
kind: Service
metadata:
  name: donezo-origin
  # GitOps PR2 (§4.2): under cutover.mode: job the selector below renders at the
  # PREVIOUS build/default pool (sync is not cutover — the Job repoints it), and the
  # pending annotation marks the Service as awaiting promotion.
{{- if eq .Values.cutover.mode "job" }}
  annotations:
    adapter-k8s.io/cutover: pending
{{- end }}
  labels:
    adapter-k8s.dev/release: "donezo"
    app.kubernetes.io/name: "donezo"
    app.kubernetes.io/component: origin
spec:
  selector:
    app.kubernetes.io/name: "donezo"
    app.kubernetes.io/component: "{{ if eq .Values.cutover.mode "job" }}{{ .Values.previousDefaultPool }}{{ else }}{{ .Values.activeDefaultPool }}{{ end }}"
    app.kubernetes.io/version: "{{ if eq .Values.cutover.mode "job" }}{{ .Values.previousBuildId }}{{ else }}{{ .Values.activeBuildId }}{{ end }}"
  ports:
    - port: 3000
      targetPort: 3000

