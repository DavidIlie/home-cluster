{
  "apiVersion": "gateway.networking.k8s.io/v1",
  "kind": "HTTPRoute",
  "metadata": {
    "name": "donezo-http-redirect",
    "namespace": "adapter-demo",
    "labels": {
      "app.kubernetes.io/name": "donezo",
      "adapter-k8s.dev/release": "donezo"
    }
  },
  "spec": {
    "parentRefs": [
      {
        "name": "donezo-gateway",
        "sectionName": "http"
      }
    ],
    "hostnames": [
      "adapter-demo.davidhome.ro"
    ],
    "rules": [
      {
        "filters": [
          {
            "type": "RequestRedirect",
            "requestRedirect": {
              "scheme": "https",
              "statusCode": 301
            }
          }
        ]
      }
    ]
  }
}
