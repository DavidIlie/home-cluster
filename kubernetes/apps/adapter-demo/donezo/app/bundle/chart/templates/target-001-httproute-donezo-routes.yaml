{
  "apiVersion": "gateway.networking.k8s.io/v1",
  "kind": "HTTPRoute",
  "metadata": {
    "name": "donezo-routes",
    "namespace": "adapter-demo",
    "labels": {
      "app.kubernetes.io/name": "donezo",
      "adapter-k8s.dev/release": "donezo"
    }
  },
  "spec": {
    "parentRefs": [
      {
        "name": "donezo-gateway",
        "sectionName": "https"
      }
    ],
    "hostnames": [
      "adapter-demo.davidhome.ro"
    ],
    "rules": [
      {
        "matches": [
          {
            "path": {
              "type": "PathPrefix",
              "value": "/"
            }
          }
        ],
        "backendRefs": [
          {
            "name": "donezo-origin",
            "port": 3000
          }
        ]
      }
    ]
  }
}
