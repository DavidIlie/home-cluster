{
  "apiVersion": "gateway.envoyproxy.io/v1alpha1",
  "kind": "EnvoyExtensionPolicy",
  "metadata": {
    "name": "donezo-routing-extproc",
    "namespace": "adapter-demo",
    "labels": {
      "app.kubernetes.io/name": "donezo",
      "app.kubernetes.io/component": "routing-service",
      "adapter-k8s.dev/release": "donezo"
    }
  },
  "spec": {
    "targetRefs": [
      {
        "group": "gateway.networking.k8s.io",
        "kind": "HTTPRoute",
        "name": "donezo-routes"
      }
    ],
    "extProc": [
      {
        "backendRefs": [
          {
            "name": "donezo-routing-service",
            "port": 8443
          }
        ],
        "processingMode": {
          "request": {}
        },
        "failOpen": false,
        "messageTimeout": "4s"
      }
    ]
  }
}
