---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nextjs-control
spec:
  selector:
    matchLabels:
      nextjs.davidilie.dev/metrics: "true"
      nextjs.davidilie.dev/runtime: control
  endpoints:
    - port: metrics
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s
