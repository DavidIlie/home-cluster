---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-control-metrics
  labels:
    nextjs.davidilie.dev/metrics: "true"
    nextjs.davidilie.dev/runtime: control
spec:
  selector:
    app.kubernetes.io/name: nextjs-control
  ports:
    - name: metrics
      port: 3000
      targetPort: http
