---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  policyTypes: [Ingress, Egress]
  ingress:
    # The only listener is the kubelet health endpoint; Hermes has no web UI.
    - from:
        - ipBlock:
            cidr: 192.168.100.180/32
      ports:
        - port: 8080
          protocol: TCP
    # The official Hermes Agent reaches the authenticated fleet-task MCP API.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-agent
      ports:
        - port: 8080
          protocol: TCP
    # Prometheus scrapes the gateway's task, outbox, and reconciliation metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # The dedicated key is accepted only by these three Workspace addresses.
    - to:
        - ipBlock:
            cidr: 192.168.100.110/32
        - ipBlock:
            cidr: 192.168.100.111/32
        - ipBlock:
            cidr: 192.168.100.112/32
      ports:
        - port: 22
          protocol: TCP
    # The private gateway consumes only David-approved friend execution intents.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hermes-friend-broker
      ports:
        - port: 8080
          protocol: TCP
    # The fleet gateway talks directly to the two external Kubernetes APIs.
    - to:
        - ipBlock:
            cidr: 192.168.100.180/32
        - ipBlock:
            cidr: 192.168.100.169/32
        - ipBlock:
            cidr: 10.4.0.182/32
      ports:
        - port: 6443
          protocol: TCP
    # Fixed media APIs receive only their service-specific credentials.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [radarr, sonarr]
      ports:
        - port: 80
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app.kubernetes.io/name: bazarr
      ports:
        - port: 6767
          protocol: TCP
    # Plex is host-networked on the home node.
    - to:
        - ipBlock:
            cidr: 192.168.100.180/32
      ports:
        - port: 32400
          protocol: TCP
    # Grafana's Viewer service account is used for dashboard and datasource reads.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 3000
          protocol: TCP
---
# Cilium gives local host-networked endpoints an entity identity rather than
# the node IP identity used by a standard ipBlock rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-kube-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes
  egress:
    # Feed Cilium's DNS proxy so the HTTPS allowlist below follows current A
    # and AAAA records instead of opening every destination on TCP 443.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        - matchName: api.github.com
        - matchName: discord.com
        - matchName: fleetview.code.davidapps.dev
        - matchName: id.davidapps.dev
        - matchName: plausible.davidapps.dev
        - matchName: seedyn.dave.tips
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "32400"
              protocol: TCP
