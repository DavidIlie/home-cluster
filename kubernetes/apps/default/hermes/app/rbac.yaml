---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-fleet-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-fleet-operator
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, services, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  # Deliberately omit patch/update on workload controllers and Flux objects.
  # Kubernetes RBAC cannot restrict a patch to only a rollout or reconcile
  # annotation, so either permission would also authorize spec replacement.
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, list, watch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-fleet-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hermes-fleet-operator
subjects:
  - kind: ServiceAccount
    name: hermes-fleet-operator
    namespace: default
---
# credential_save persists validated keys David pastes in his owner thread.
# Flux creates the Secret once and never overwrites it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-runtime-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [hermes-runtime-credentials]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-runtime-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-runtime-credentials
subjects:
  - kind: ServiceAccount
    name: hermes-fleet-operator
    namespace: default
