---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      hermes:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          prepare-secrets:
            image: &image
              repository: ghcr.io/davidilie/hermes
              tag: 45d7edd@sha256:efcf62d94569ae7782ff3924500687ae20f9b0d02ee83939cbea884684af1cbf
            command: ["/bin/sh", "-ec"]
            args:
              - |
                cp /run/secrets/source/fleetview-token /run/secrets/hermes/fleetview-token
                cp /run/secrets/source/mcp-token /run/secrets/hermes/mcp-token
                cp /run/secrets/source/ssh-private-key /run/secrets/hermes/ssh-private-key
                cp /run/secrets/source/davidapps-kube-token /run/secrets/hermes/davidapps-kube-token
                cp /run/secrets/source/davidapps-kube-ca /run/secrets/hermes/davidapps-kube-ca
                cp /run/secrets/source/uk-kube-token /run/secrets/hermes/uk-kube-token
                cp /run/secrets/source/uk-kube-ca /run/secrets/hermes/uk-kube-ca
                cp /run/secrets/source/radarr-api-key /run/secrets/hermes/radarr-api-key
                cp /run/secrets/source/sonarr-api-key /run/secrets/hermes/sonarr-api-key
                cp /run/secrets/source/bazarr-api-key /run/secrets/hermes/bazarr-api-key
                cp /run/secrets/source/plex-token /run/secrets/hermes/plex-token
                cp /run/secrets/source/grafana-token /run/secrets/hermes/grafana-token
                cp /run/secrets/source/davidapps-api-key /run/secrets/hermes/davidapps-api-key
                cp /run/secrets/source/github-token /run/secrets/hermes/github-token
                cp /run/secrets/source/discord-token /run/secrets/hermes/discord-token
                cp /run/secrets/source/plausible-api-key /run/secrets/hermes/plausible-api-key
                chmod 0600 /run/secrets/hermes/*
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *image
            env:
              TZ: Europe/Madrid
              # Delivery-only is independent of the legacy bot. Keeping the
              # legacy switch off also makes this fail closed on older images.
              HERMES_DISCORD_ENABLED: "false"
              HERMES_DISCORD_DELIVERY_ONLY: "true"
              HERMES_DISCORD_GUILD_ID: "853884362436116491"
              HERMES_DISCORD_CHANNEL_ID: "1537861134076350465"
              HERMES_DISCORD_USER_ID: "243009043260637184"
              HERMES_DISCORD_TOKEN_FILE: /run/secrets/hermes/discord-token
              HERMES_FLEETVIEW_URL: https://fleetview.code.davidapps.dev/mcp
              HERMES_FLEETVIEW_ORIGIN: https://fleetview.code.davidapps.dev
              HERMES_MCP_TOKEN_FILE: /run/secrets/hermes/mcp-token
              HERMES_SSH_USER: hermes
              HERMES_SSH_HOME: /home/hermes
              HERMES_MONITOR_INTERVAL: 15s
              HERMES_GITHUB_OWNER: DavidIlie
              HERMES_GITHUB_TOKEN_FILE: /run/secrets/hermes/github-token
              HERMES_KUBE_HOME_SERVER: https://192.168.100.180:6443
              HERMES_KUBE_DAVIDAPPS_SERVER: https://192.168.100.169:6443
              HERMES_KUBE_DAVIDAPPS_TOKEN_FILE: /run/secrets/hermes/davidapps-kube-token
              HERMES_KUBE_DAVIDAPPS_CA_FILE: /run/secrets/hermes/davidapps-kube-ca
              HERMES_KUBE_UK_SERVER: https://10.4.0.182:6443
              HERMES_KUBE_UK_TOKEN_FILE: /run/secrets/hermes/uk-kube-token
              HERMES_KUBE_UK_CA_FILE: /run/secrets/hermes/uk-kube-ca
              HERMES_RADARR_URL: http://radarr.media.svc.cluster.local
              HERMES_RADARR_TOKEN_FILE: /run/secrets/hermes/radarr-api-key
              HERMES_SONARR_URL: http://sonarr.media.svc.cluster.local
              HERMES_SONARR_TOKEN_FILE: /run/secrets/hermes/sonarr-api-key
              HERMES_BAZARR_URL: http://bazarr.media.svc.cluster.local:6767
              HERMES_BAZARR_TOKEN_FILE: /run/secrets/hermes/bazarr-api-key
              HERMES_PLEX_URL: http://plex.media.svc.cluster.local:32400
              HERMES_PLEX_TOKEN_FILE: /run/secrets/hermes/plex-token
              HERMES_GRAFANA_URL: http://grafana.observability.svc.cluster.local
              HERMES_GRAFANA_TOKEN_FILE: /run/secrets/hermes/grafana-token
              HERMES_PLAUSIBLE_URL: https://plausible.davidapps.dev
              HERMES_PLAUSIBLE_TOKEN_FILE: /run/secrets/hermes/plausible-api-key
              HERMES_PLAUSIBLE_SITE_IDS: anaxax.tv,app.kidays.fr,brainbuzzapp.com,controlfits.com,createidol.io,davidilie.com,docs.workroad.app,en.mbretrofit.ro,kidays.fr,mbretrofit.es,mbretrofit.it,mbretrofit.ro,plexo.davidhome.ro,quickgoon.com,ro.davidinfra.co.uk,store.workroad.app,t3.gurt.ing,workroad.app,zerocut.gg
              HERMES_PLAUSIBLE_CUSTOM_EVENT_SCHEMAS: '[{"site_id":"mbretrofit.it","event":"hero-redirect","properties":["loggedIn","vin"],"vin_property":"vin"},{"site_id":"mbretrofit.it","event":"hero-failed","properties":["vin"],"vin_property":"vin"},{"site_id":"mbretrofit.it","event":"car-details-viewed","properties":["vin"],"vin_property":"vin"},{"site_id":"mbretrofit.it","event":"error","properties":["error","path"]}]'
              HERMES_DAVIDAPPS_URL: https://id.davidapps.dev
              HERMES_DAVIDAPPS_TOKEN_FILE: /run/secrets/hermes/davidapps-api-key
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 2
                  failureThreshold: 30
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext: *securityContext
    serviceAccount:
      create: false
      name: hermes-fleet-operator
    defaultPodOptions:
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: docker-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: hermes
        ports:
          health:
            port: *port
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /data
      secret-source:
        type: secret
        name: hermes-secrets
        defaultMode: 0444
        advancedMounts:
          hermes:
            prepare-secrets:
              - path: /run/secrets/source
                readOnly: true
      secrets:
        type: emptyDir
        advancedMounts:
          hermes:
            prepare-secrets:
              - path: /run/secrets/hermes
            app:
              - path: /run/secrets/hermes
                readOnly: true
      known-hosts:
        type: configMap
        name: hermes-known-hosts
        defaultMode: 0444
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes/known_hosts
                subPath: known_hosts
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
