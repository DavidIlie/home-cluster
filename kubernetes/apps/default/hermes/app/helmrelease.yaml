---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      hermes:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          prepare-secrets:
            image: &image
              repository: ghcr.io/davidilie/hermes
              tag: 765b598@sha256:8e319de912f03211216f8f9704bbab12b64e22a7898def0084dcd1d1a26eb891
            command: ["/bin/sh", "-ec"]
            args:
              - |
                cp /run/secrets/source/discord-token /run/secrets/hermes/discord-token
                cp /run/secrets/source/fleetview-token /run/secrets/hermes/fleetview-token
                cp /run/secrets/source/ssh-private-key /run/secrets/hermes/ssh-private-key
                chmod 0600 /run/secrets/hermes/*
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *image
            env:
              TZ: Europe/Madrid
              HERMES_DISCORD_GUILD_ID: "853884362436116491"
              HERMES_DISCORD_CHANNEL_ID: "1537861134076350465"
              HERMES_DISCORD_USER_ID: "243009043260637184"
              HERMES_FLEETVIEW_URL: https://fleetview.code.davidapps.dev/mcp
              HERMES_FLEETVIEW_ORIGIN: https://fleetview.code.davidapps.dev
              HERMES_MONITOR_INTERVAL: 15s
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 2
                  failureThreshold: 30
            resources:
              requests:
                cpu: 20m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            securityContext: *securityContext
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: docker-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: hermes
        ports:
          health:
            port: *port
    persistence:
      data:
        existingClaim: hermes
        globalMounts:
          - path: /data
      secret-source:
        type: secret
        name: hermes-secrets
        defaultMode: 0444
        advancedMounts:
          hermes:
            prepare-secrets:
              - path: /run/secrets/source
                readOnly: true
      secrets:
        type: emptyDir
        advancedMounts:
          hermes:
            prepare-secrets:
              - path: /run/secrets/hermes
            app:
              - path: /run/secrets/hermes
                readOnly: true
      known-hosts:
        type: configMap
        name: hermes-known-hosts
        defaultMode: 0444
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes/known_hosts
                subPath: known_hosts
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
