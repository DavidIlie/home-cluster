---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minimserver
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      minimserver:
        pod:
          hostNetwork: true
        # NOTE: hostNetwork singleton - a surging pod cannot bind :9790 while the old one holds it
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed-config:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                CFG=/opt/minimserver/data/minimserver.config
                mkdir -p /opt/minimserver/data
                rm -f "${CFG}.lock"
                touch "$CFG"
                if ! grep -q '^minimserver.contentDir' "$CFG"; then
                  echo 'minimserver.contentDir = /media' >> "$CFG"
                  echo "seeded contentDir=/media"
                else
                  echo "contentDir already set: $(grep '^minimserver.contentDir' "$CFG")"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/davidilie/minimserver
              tag: 0.8.4-8da9fd9@sha256:f561bf3e08f46ee0743d9df9943563b05ca8f799b9d61f53260ec1cbb14920c1
            env:
              TZ: Europe/Bucharest
              MINIM_INDEX_ROLE: primary
              MINIM_SHARED_INDEX: /index
              MINIM_WATCH_INTERVAL: "60"
              MINIM_SCAN_PREFETCH_THREADS: "16"
              MINIM_TRUST_CACHE_ON_BROWSE: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9790
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 750Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: docker-regcred
    persistence:
      data:
        existingClaim: minimserver-data
        globalMounts:
          - path: /opt/minimserver/data
      music:
        type: nfs
        server: 192.168.25.3
        path: /mnt/data/share/Music
        globalMounts:
          - path: /media
      index:
        existingClaim: minimserver-index-nfs
        globalMounts:
          - path: /index
    service:
      app:
        controller: minimserver
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: MinimServer
          gethomepage.dev/icon: mdi-music-box
          gethomepage.dev/description: DLNA Music Server
          gatus.home-operations.com/endpoint: |-
            name: MinimServer
            group: Media
            url: https://dlna.davidhome.ro
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &host "dlna.davidhome.ro"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
