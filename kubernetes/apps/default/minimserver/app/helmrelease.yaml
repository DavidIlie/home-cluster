---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minimserver
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      minimserver:
        pod:
          hostNetwork: true
        # NOTE: hostNetwork singleton - a surging pod cannot bind :9790 while the old one holds it
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          seed-config:
            image:
              repository: docker.io/library/busybox
              tag: "1.38@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e"
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                CFG=/opt/minimserver/data/minimserver.config
                mkdir -p /opt/minimserver/data
                rm -f "${CFG}.lock"
                touch "$CFG"
                if ! grep -q '^minimserver.contentDir' "$CFG"; then
                  echo 'minimserver.contentDir = /media' >> "$CFG"
                  echo "seeded contentDir=/media"
                else
                  echo "contentDir already set: $(grep '^minimserver.contentDir' "$CFG")"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/davidilie/minimserver
              tag: 0.8.4-c9beb44@sha256:b59055fda90752009465ecadf9c6418cf63491b1891ab32621c7af02e9f84a2e
            env:
              TZ: Europe/Bucharest
              MINIM_INDEX_ROLE: primary
              MINIM_SHARED_INDEX: /index
              MINIM_WATCH_INTERVAL: "60"
              MINIM_SCAN_PREFETCH_THREADS: "16"
              MINIM_TRUST_CACHE_ON_BROWSE: "true"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: 9790
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 9790
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 9790
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 120
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 750Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: docker-regcred
    persistence:
      data:
        existingClaim: minimserver-data
        globalMounts:
          - path: /opt/minimserver/data
      music:
        type: nfs
        server: 192.168.25.3
        path: /mnt/data/share/Music
        globalMounts:
          - path: /media
            readOnly: true
      index:
        existingClaim: minimserver-index-nfs
        globalMounts:
          - path: /index
    service:
      app:
        controller: minimserver
        ports:
          http:
            port: 9790
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: MinimServer
          gethomepage.dev/icon: mdi-music-box
          gethomepage.dev/description: DLNA Music Server
          gatus.home-operations.com/endpoint: |-
            name: MinimServer
            group: Media
            url: https://dlna.davidhome.ro/readyz
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &host "dlna.davidhome.ro"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
