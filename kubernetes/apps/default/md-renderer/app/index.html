<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="David Ilie's home cluster documentation" />
    <meta name="theme-color" content="#0d1117" />
    <title>David's Home Cluster</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css"
    />
    <style>
      :root {
        color-scheme: light dark;
        --accent: #22c55e;
        --canvas: #f6f8fa;
        --surface: #ffffff;
        --text: #1f2328;
        --muted: #59636e;
        --border: #d0d7de;
        --code: #eff1f3;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--canvas);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-nav {
        position: fixed;
        top: 18px;
        right: max(24px, calc((100vw - 980px) / 2));
        z-index: 20;
        margin: 0;
      }

      .app-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in srgb, var(--surface) 88%, transparent);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      .app-nav a:hover { border-color: var(--accent); color: var(--accent); }

      .markdown-section {
        max-width: 980px;
        min-height: calc(100vh - 64px);
        margin: 32px auto;
        padding: clamp(28px, 6vw, 72px);
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgb(31 35 40 / 7%);
        color: var(--text);
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: var(--text);
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .markdown-section h2 { border-bottom-color: var(--border); }
      .markdown-section a { color: #15803d; font-weight: 500; }
      .markdown-section hr { border-color: var(--border); }

      .markdown-section img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .markdown-section table {
        display: table;
        width: 100%;
        overflow: hidden;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .markdown-section tr:nth-child(2n) { background: var(--canvas); }
      .markdown-section th,
      .markdown-section td { border-color: var(--border); }
      .markdown-section code { background: var(--code); color: var(--text); }

      #docsify-darklight-theme { right: 20px !important; bottom: 20px !important; }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d1117;
          --surface: #161b22;
          --text: #e6edf3;
          --muted: #8b949e;
          --border: #30363d;
          --code: #21262d;
        }

        .markdown-section a { color: #3fb950; }
      }

      @media (max-width: 700px) {
        .app-nav { position: absolute; top: 12px; right: 12px; }
        .markdown-section {
          min-height: 100vh;
          margin: 0;
          padding: 72px 20px 40px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .markdown-section table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="https://github.com/DavidIlie/home-cluster" rel="noopener">View on GitHub ↗</a>
    </nav>
    <main id="app">Loading the cluster README…</main>
    <script>
      window.$docsify = {
        name: "Home Cluster",
        homepage: "https://raw.githubusercontent.com/DavidIlie/home-cluster/main/README.md",
        auto2top: true,
        executeScript: false,
        externalLinkTarget: "_blank",
        loadNavbar: false,
        loadSidebar: false,
        maxLevel: 4,
        relativePath: false,
        themeColor: "#22c55e"
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  </body>
</html>
