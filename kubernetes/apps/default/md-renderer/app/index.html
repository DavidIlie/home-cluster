<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="David Ilie's home cluster documentation" />
    <meta name="theme-color" content="#0d1117" />
    <title>David's Home Cluster</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --accent: #58a6ff;
        --accent-muted: rgb(56 139 253 / 15%);
        --canvas: #0d1117;
        --surface: #161b22;
        --surface-raised: #1c2128;
        --text: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --code: #21262d;
        --sidebar-width: 286px;
      }

      * { box-sizing: border-box; }

      body {
        background: var(--canvas);
        color: var(--text);
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app-nav {
        position: fixed;
        top: 18px;
        right: 24px;
        z-index: 20;
        margin: 0;
      }

      .app-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgb(22 27 34 / 88%);
        color: var(--text);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        backdrop-filter: blur(12px);
      }

      .app-nav a:hover { border-color: var(--accent); color: var(--accent); }

      .sidebar {
        width: var(--sidebar-width);
        border-right: 1px solid var(--border);
        background: var(--surface);
        color: var(--muted);
      }

      .sidebar > h1 {
        margin: 34px 24px 22px;
        color: var(--text);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-align: left;
      }

      .sidebar-nav { padding: 0 14px 28px; }

      .sidebar-nav li { margin: 3px 0; }

      .sidebar-nav a {
        display: block;
        padding: 8px 10px;
        border-radius: 7px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }

      .sidebar-nav a:hover,
      .sidebar-nav li.active > a {
        border-right: 0;
        background: var(--accent-muted);
        color: var(--text);
      }

      .sidebar-toggle {
        background: var(--surface);
      }

      .sidebar-toggle span { background-color: var(--accent); }

      .content { left: var(--sidebar-width); }

      .markdown-section {
        max-width: 940px;
        min-height: calc(100vh - 64px);
        margin: 0 auto;
        padding: 92px clamp(28px, 6vw, 72px) 72px;
        background: var(--canvas);
        color: var(--text);
      }

      .markdown-section h1,
      .markdown-section h2,
      .markdown-section h3 {
        color: var(--text);
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .markdown-section h1 { font-size: 2rem; }
      .markdown-section h2 {
        margin-top: 2.2em;
        padding-bottom: 0.4em;
        border-bottom-color: var(--border);
      }
      .markdown-section a { color: #58a6ff; font-weight: 500; }
      .markdown-section a:hover { color: #79c0ff; }
      .markdown-section hr { border-color: var(--border); }
      .markdown-section p,
      .markdown-section li { color: #c9d1d9; }

      .markdown-section img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
      }

      .markdown-section table {
        display: table;
        width: 100%;
        overflow: hidden;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }

      .markdown-section tr:nth-child(2n) { background: var(--surface-raised); }
      .markdown-section th,
      .markdown-section td { border-color: var(--border); color: #c9d1d9; }
      .markdown-section th { border-color: var(--border); color: var(--text); }
      .markdown-section code { background: var(--code); color: var(--text); }

      .progress { background-color: var(--accent); }

      #docsify-darklight-theme { right: 20px !important; bottom: 20px !important; }

      @media (max-width: 700px) {
        .app-nav { position: absolute; top: 12px; right: 12px; }
        .content { left: 0; }
        .markdown-section {
          min-height: 100vh;
          margin: 0;
          padding: 72px 20px 40px;
          border: 0;
          border-radius: 0;
          box-shadow: none;
        }

        .markdown-section table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="https://github.com/DavidIlie/home-cluster" rel="noopener">View on GitHub ↗</a>
    </nav>
    <main id="app">Loading the cluster README…</main>
    <script>
      window.$docsify = {
        name: "Home Cluster",
        homepage: "https://raw.githubusercontent.com/DavidIlie/home-cluster/main/README.md",
        auto2top: true,
        executeScript: false,
        externalLinkTarget: "_blank",
        loadNavbar: false,
        loadSidebar: false,
        maxLevel: 4,
        relativePath: false,
        themeColor: "#58a6ff"
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  </body>
</html>
