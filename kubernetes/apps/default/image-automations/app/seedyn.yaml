---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seedyn
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: seedyn
  filterTags:
    pattern: "^.+-[a-f0-9]+-(?P<ts>[0-9]+)"
    extract: "$ts"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seedyn
  namespace: flux-system
spec:
  image: ghcr.io/davidilie/seedyn
  interval: 1m0s
  secretRef:
    name: docker-regcred
