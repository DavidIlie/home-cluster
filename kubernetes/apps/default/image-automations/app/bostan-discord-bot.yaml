---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: bostan-discord-bot
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: bostan-discord-bot
  filterTags:
    pattern: "^main-[a-f0-9]+-(?P<ts>[0-9]+)"
    extract: "$ts"
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: bostan-discord-bot
  namespace: flux-system
spec:
  image: ghcr.io/bostanenterprise/bostan-discord-bot
  interval: 1m0s
  secretRef:
    name: docker-regcred
