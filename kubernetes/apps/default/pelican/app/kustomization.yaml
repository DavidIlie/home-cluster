---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./claim.yaml
  - ./secret.sops.yaml
  - ./forwarder-secret.sops.yaml
components:
  - ../../../../flux/components/volsync
configMapGenerator:
  - name: pelican-caddyfile
    files:
      - Caddyfile=./config/Caddyfile
  - name: pelican-oidc-provider
    files:
      - GenericOIDCProvider.php=./config/GenericOIDCProvider.php
  - name: pelican-startup
    files:
      - start.sh=./config/start.sh
      - concierge-effort.php=./config/concierge-effort.php
generatorOptions:
  disableNameSuffixHash: true
