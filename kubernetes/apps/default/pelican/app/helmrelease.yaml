---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pelican
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      pelican:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.7@sha256:6d4cfa4b8d343eb6fa0de8dd9ec416a2007f346bb631fc8e246e1f39eee6c4aa
            envFrom:
              - secretRef:
                  name: pelican-secret
        containers:
          app:
            command: ["/bin/sh", "/etc/pelican-start.sh"]
            image:
              repository: ghcr.io/pelican/panel
              tag: v1.0.0-beta38@sha256:46f356f3fda423b1d43f0dc3c71efc056cd8b9bec365d1d7817306a17ee5694a
            env:
              XDG_DATA_HOME: /pelican-data
              BEHIND_PROXY: "true"
              APP_URL: https://panel.davidapps.dev
              ADMIN_EMAIL: david@davidilie.com
            envFrom:
              - secretRef:
                  name: pelican-secret
            # NOTE: tcpSocket, not httpGet. Caddy listens on :80 only and 302s
            # every path to https://<host>/login; kubelet *follows* probe
            # redirects, so an httpGet probe ends up dialling :443 and fails
            # with connection refused. A TCP probe proves the listener is up
            # without chasing the redirect.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 180
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 25m
                memory: 320Mi
    service:
      pelican:
        controller: pelican
        ports:
          http:
            port: *port
          https:
            port: 443
    route:
      pelican:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            name: Pelican Panel (Envoy)
            group: Gaming
            url: https://panel.davidapps.dev
            interval: 1m
            client:
              dns-resolver: tcp://1.1.1.1:53
            conditions: ["[STATUS] == any(200, 302)"]
        hostnames:
          - panel.davidapps.dev
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Forwarded-For
                      value: '%REQ(cf-connecting-ip)%'
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=31449600; includeSubDomains
            backendRefs:
              - name: pelican
                port: 80
    ingress:
      pelican:
        className: external
        annotations:
          gatus.home-operations.com/enabled: "false"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Gaming
          gethomepage.dev/name: Pelican
          gethomepage.dev/icon: pterodactyl.png
          gethomepage.dev/description: Game Server Panel
          gatus.home-operations.com/endpoint: |-
            name: Pelican Panel
            group: Gaming
            url: https://panel.davidapps.dev
            interval: 1m
            conditions: ["[STATUS] == any(200, 302)"]
        hosts:
          - host: "panel.davidapps.dev"
            paths:
              - path: /
                service:
                  identifier: pelican
                  port: http
    persistence:
      config-log:
        existingClaim: pelican
        globalMounts:
          - path: /pelican-data
          - path: /var/www/html/plugins
            subPath: plugins
      media:
        existingClaim: pelican-logs
        globalMounts:
          - path: /var/www/html/storage/logs
      plex-chromecast-profile:
        type: configMap
        name: pelican-caddyfile
        globalMounts:
          - path: /etc/caddy/Caddyfile
            subPath: Caddyfile
            readOnly: true
      oidc-provider:
        type: configMap
        name: pelican-oidc-provider
        globalMounts:
          - path: /var/www/html/plugins/generic-oidc-providers/src/Extensions/OAuth/Providers/GenericOIDCProvider.php
            subPath: GenericOIDCProvider.php
            readOnly: true
      forwarder-secret:
        type: secret
        name: pelican-forwarder
        globalMounts:
          - path: /etc/pelican-forwarder
            readOnly: true
      startup:
        type: configMap
        name: pelican-startup
        globalMounts:
          - path: /etc/pelican-start.sh
            subPath: start.sh
            readOnly: true
          - path: /etc/pelican-concierge-effort.php
            subPath: concierge-effort.php
            readOnly: true
