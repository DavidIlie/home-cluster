---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-friend-broker
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      hermes-friend-broker:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/davidilie/hermes-friend-broker
              tag: sha-e5bc421b6b990bb984d6ef6ac303b01df1c58f8f@sha256:00144a54c171ed7583d980a89b96785f427f04595d52738b9e16ee7be61b200e
            env:
              TZ: Europe/Madrid
              HERMES_FRIEND_BROKER_ADDRESS: :8080
              HERMES_FRIEND_BROKER_DB: /data/friend-code.db
              HERMES_FRIEND_BROKER_TOKEN_HASH_FILE: /run/secrets/friend-code/friend.sha256
              HERMES_FRIEND_BROKER_DELIVERY_TOKEN_HASH_FILE: /run/secrets/friend-code/delivery.sha256
              HERMES_FRIEND_BROKER_OWNER_TOKEN_HASH_FILE: /run/secrets/friend-code/owner.sha256
              HERMES_FRIEND_BROKER_GUILD_ID: "1540757211146493993"
              HERMES_FRIEND_BROKER_CHANNEL_ID: "1540773031436353708"
              HERMES_FRIEND_BROKER_OWNER_GUILD_ID: "853884362436116491"
              HERMES_FRIEND_BROKER_OWNER_CHANNEL_ID: "1537861134076350465"
              HERMES_FRIEND_BROKER_OWNER_USER_ID: "243009043260637184"
              HERMES_FRIEND_WORKSPACE_ENABLED: "true"
              HERMES_FRIEND_BROKER_WORKSPACE_TOKEN_HASH_FILE: /run/secrets/friend-code/workspace.sha256
              HERMES_FRIEND_WORKSPACE_APPROVAL_SIGNING_KEY_FILE: /run/secrets/friend-workspace/approval-private-key
              HERMES_FRIEND_WORKSPACE_POLICY_REVISION: workspace-v1
              HERMES_FRIEND_WORKSPACE_SANDBOX_ORG: DavidIlie-friends-sandbox
              HERMES_FRIEND_WORKSPACE_CREATOR_APP_ID: "4690613"
              HERMES_FRIEND_WORKSPACE_CREATOR_INSTALLATION_ID: "155902914"
              HERMES_FRIEND_WORKSPACE_PUBLISHER_APP_ID: "4690643"
              HERMES_FRIEND_WORKSPACE_PUBLISHER_INSTALLATION_ID: "155903341"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: &port 8080
                  initialDelaySeconds: 2
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 1
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 250m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    serviceAccount:
      create: true
      name: hermes-friend-broker
    defaultPodOptions:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: docker-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: hermes-friend-broker
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: hermes-friend-broker
        globalMounts:
          - path: /data
      hashes:
        type: secret
        name: hermes-friend-broker-hashes
        defaultMode: 0444
        globalMounts:
          - path: /run/secrets/friend-code
            readOnly: true
      workspace-signing:
        type: secret
        name: hermes-friend-runner-signing
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets/friend-workspace
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
