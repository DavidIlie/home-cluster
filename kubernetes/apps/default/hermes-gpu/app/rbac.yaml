---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-gpu-operator
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-gpu-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-gpu-operator
subjects:
  - kind: ServiceAccount
    name: hermes-fleet-operator
    namespace: default
