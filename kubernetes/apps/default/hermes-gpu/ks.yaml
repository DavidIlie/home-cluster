---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-gpu
  namespace: default
spec:
  targetNamespace: hermes-gpu
  commonMetadata:
    labels:
      app.kubernetes.io/name: hermes-gpu
  path: ./kubernetes/apps/default/hermes-gpu/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
