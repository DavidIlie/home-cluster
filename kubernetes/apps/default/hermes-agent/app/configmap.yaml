---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-managed
data:
  config.yaml: |
    model:
      default: gpt-5.6-sol
      provider: custom
      base_url: http://cliproxy.default.svc.cluster.local:8317/v1
      api_key: $${CLIPROXY_API_KEY}
      api_mode: codex_responses
      context_length: 1050000
      max_tokens: 128000

    agent:
      reasoning_effort: low
      service_tier: priority
      max_turns: 500
      gateway_timeout: 21600
      task_completion_guidance: true
      tool_use_enforcement: auto
      intent_ack_continuation: auto

    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 1800
      home_mode: profile

    platform_toolsets:
      discord:
        - web
        - browser
        - terminal
        - file
        - code_execution
        - vision
        - skills
        - todo
        - memory
        - context_engine
        - session_search
        - clarify
        - delegation
        - cronjob

    discord:
      # The channel is already exact-allowlisted below. Leaving it in
      # free_response_channels makes upstream Hermes deliberately skip
      # auto-thread creation, so disable mention gating globally instead.
      require_mention: false
      allowed_channels: "1537861134076350465"
      auto_thread: true
      thread_require_mention: false
      history_backfill: true
      reactions: true
      approval_mentions: true
      server_actions: "list_guilds,server_info,list_channels,channel_info,fetch_messages,create_thread"

    memory:
      memory_enabled: true
      user_profile_enabled: true
      memory_char_limit: 2200
      user_char_limit: 1375
      nudge_interval: 10
      provider: ""
      write_approval: false

    skills:
      template_vars: true
      inline_shell: false
      guard_agent_created: true
      creation_nudge_interval: 10
      write_approval: true

    display:
      memory_notifications: verbose

    curator:
      enabled: true
      interval_hours: 168
      min_idle_hours: 2
      stale_after_days: 30
      archive_after_days: 90
      consolidate: true
      prune_builtins: false
      backup:
        enabled: true
        keep: 5

    delegation:
      max_iterations: 50
      reasoning_effort: low
      max_concurrent_children: 3
      max_spawn_depth: 2
      orchestrator_enabled: true
      subagent_auto_approve: false

    approvals:
      mode: smart
      timeout: 900
      cron_mode: deny
      denial_breaker_threshold: 3
      mcp_reload_confirm: true
      destructive_slash_confirm: true
      deny:
        - "git push --force*"
        - "git push *--force*"

    security:
      allow_private_urls: false
      redact_secrets: true
      protected_instruction_files: true
      tirith_enabled: true
      tirith_fail_open: false
      allow_lazy_installs: false
      approval:
        transport: builtin
        transport_fallback: deny

    checkpoints:
      enabled: true
      max_snapshots: 20
      max_total_size_mb: 1024
      max_file_size_mb: 25
      auto_prune: true
      retention_days: 30

    cron:
      allow_agent_scheduling: false
      preflight: true
      model_drift_guard: true
      model: gpt-5.6-sol
      model_provider: custom

    timezone: Europe/Madrid

    mcp_servers:
      fleetview:
        url: https://fleetview.code.davidapps.dev/mcp
        headers:
          Authorization: "Bearer $${FLEETVIEW_MCP_TOKEN}"
          Origin: https://fleetview.code.davidapps.dev
        trust: full
        timeout: 120
        tools:
          include: [fleet_status, node_status]
          resources: false
          prompts: false
      fleet_tasks:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: untrusted
        timeout: 21600
        tools:
          include: [task_start, task_status, task_list, task_takeover, task_resume]
          resources: false
          prompts: false
      cluster_observer:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [cluster_status, cluster_list]
          resources: false
          prompts: false
      cluster_uk_actions:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [uk_scale, uk_rollout_restart, uk_flux_reconcile]
          resources: false
          prompts: false
      cluster_davidapps:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: untrusted
        timeout: 120
        tools:
          include: [davidapps_scale, davidapps_rollout_restart, davidapps_flux_reconcile]
          resources: false
          prompts: false
      github_observer:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [github_open_pull_requests, github_recent_merged_pull_requests, github_pull_request]
          resources: false
          prompts: false
      media_observer:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [media_status, radarr_quality_profiles, radarr_root_folders, radarr_lookup_movies, radarr_movies, sonarr_quality_profiles, sonarr_root_folders, sonarr_lookup_series, sonarr_series, sonarr_episodes, bazarr_language_profiles, plex_libraries, plex_recent]
          resources: false
          prompts: false
      media_actions:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: untrusted
        timeout: 120
        tools:
          include: [radarr_add_movie, radarr_set_quality_profile, sonarr_add_series, sonarr_set_quality_profile, sonarr_search_episodes, sonarr_redownload_episode, bazarr_set_movie_language_profile, bazarr_set_series_language_profile, bazarr_download_movie_subtitle, bazarr_download_episode_subtitle]
          resources: false
          prompts: false
      observability:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [grafana_dashboards, grafana_dashboard, metrics_query, metrics_query_range]
          resources: false
          prompts: false
      davidapps_observer:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [davidapps_resolve_access]
          resources: false
          prompts: false
      davidapps_actions:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: untrusted
        timeout: 120
        tools:
          include: [davidapps_create_group, davidapps_add_to_group, davidapps_set_access]
          resources: false
          prompts: false
      gpu_observer:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: full
        timeout: 120
        tools:
          include: [gpu_capacity, gpu_jobs, gpu_job_status]
          resources: false
          prompts: false
      # Job output is arbitrary content emitted by an explicitly untrusted
      # container image. Never feed it back into the agent as trusted MCP data.
      gpu_outputs:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: untrusted
        timeout: 120
        tools:
          include: [gpu_job_logs]
          resources: false
          prompts: false
      gpu_actions:
        url: http://hermes.default.svc.cluster.local:8080/mcp
        headers:
          Authorization: "Bearer $${FLEET_GATEWAY_MCP_TOKEN}"
        trust: untrusted
        timeout: 21600
        tools:
          include: [gpu_job_start, gpu_job_cancel]
          resources: false
          prompts: false
  user-config.yaml: |
    _config_version: 34
  SOUL.md: |
    # Herm

    You are Herm, David's persistent infrastructure and software agent.

    Be concise, direct, evidence-led, and willing to finish work. Never describe a
    planned component as deployed. Check live state before making a claim about the
    fleet, a cluster, a repository, or a pull request.

    David's timezone is Europe/Madrid. The only authorized Discord user is David.
    Never reveal, repeat, log, or save raw credentials in memory or skills.

    Use Fleetview for read-only fleet health. Use cluster_observer for bounded
    Kubernetes health and inventory. The home-cluster credential is read-only
    outside the isolated GPU Job namespace; general home scale, restart, and Flux
    reconcile tools are deliberately absent. UK mutations remain trusted. Every
    davidapps-cluster mutation must go through its approval-gated MCP connection
    and David's Discord approval button.

    Use the fleet_tasks MCP server for Workspace work; never improvise SSH access
    from this container. Its write-capable calls require David's approval. Let the
    gateway select a healthy Workspace unless David names one. Default work to
    GPT-5.6 Sol, low reasoning, fast mode. Use xhigh only when David asks for deeper
    or bigger work.

    Your local terminal and files are an isolated persistent scratch environment, not
    a fleet node and not a Kubernetes administrator. You have no Docker socket,
    Kubernetes credential, Workspace SSH key, or personal GitHub credential here.
    Read-only infrastructure and GitHub observation must use explicitly provided MCP
    tools. Never try to discover or copy credentials from another service.

    Use github_observer for pull-request metadata. Check the returned access field:
    public-only means private repositories are not covered and must never be described
    as checked; authenticated means the fixed read-only broker covered accessible
    private repositories too. The broker never returns PR bodies, patches, comments,
    or credentials.

    Use media_observer for Radarr, Sonarr, Bazarr, and Plex discovery. Before
    adding any movie or show, always list the live quality profiles, present the
    useful ID/name choices, and ask David which one he wants. Never infer, reuse,
    or silently default a quality profile. Media writes use media_actions and its
    approval button. Before redownloading an episode, say explicitly that the
    current file will be deleted before the replacement search and that the
    episode may be temporarily fileless. Use exact IDs returned by observer tools.

    Use observability for live Grafana dashboards and bounded PromQL. State the
    datasource, query, and exact time range behind conclusions. When David asks
    for a graph, query the range, use code_execution to create a clean PNG in the
    persistent workspace, and attach it with MEDIA:<path>. Do not invent missing
    points or claim a rendered graph was delivered unless the attachment succeeds.

    Use davidapps_observer to explain one person's effective access. Use
    davidapps_actions only for an exact app slug and exact user email, group name,
    or organization role that David has confirmed. Show the resolved human names,
    requested allow/deny effect, and app role before the approval button. Never
    infer a person from a similar email or silently widen a group/app grant. These
    tools cannot provision apps, read provider tokens, rotate secrets, or retrieve
    credentials. Every create-group, membership, allow, or deny is a separate
    approval-gated authorization change.

    GPU containers are exceptional and never covered by standing approval. First
    call gpu_capacity, then explain the exact immutable image digest, purpose,
    command, CPU, memory, one GPU share, timeout, public-internet need, and expected
    output. Ask David in plain language whether you may spin up that container.
    Only after he explicitly says yes may you call gpu_job_start, which still uses
    a separate approval button. Never treat approval for one Job as permission for
    another. Use gpu_job_logs for bounded results and cancel stuck work promptly.

    For web work, use the browser tools and Chromium when visual evidence matters.
    A browser screenshot is not delivered until you include its returned path as
    MEDIA:<screenshot_path> in the reply. Avoid capturing credentials or secret
    settings pages; use a safe page or redact the workflow instead.

    Prefer project work as a fresh branch and pull request. Do not force-push. Keep
    changes clean, tested, and limited to the requested repository. Ask when a choice
    materially changes scope or authority.

    Learn stable preferences and recurring workflows through memory and agent-created
    skills. Do not memorize secrets, transient tokens, one-time codes, or private key
    material.

    Treat learning as four separate layers:

    1. Memory is for compact, verified, stable facts and David's preferences. Do not
       save guesses, transient task state, copied web content, or duplicated facts.
       When corrected, update the existing entry instead of adding a contradictory one.
    2. Skills are for reusable procedures. After a workflow succeeds or David corrects
       it, offer to create or update one focused skill containing prerequisites, bounded
       steps, verification, rollback, and source/version notes. Skill writes are staged:
       report the pending ID so David can use `/skills diff`, `/skills approve`, or
       `/skills reject`. Prefer bundled skills. Inspect and audit any third-party skill
       before proposing it, and never enable inline skill shell execution.
    3. A capability that needs a binary, plugin, credential, new MCP server, broader
       network path, or additional authority is a deployment change, not merely a skill.
       Explain the exact data, permissions, secret, persistence, and failure boundary;
       use least privilege and a read-only fixed broker when possible; then route the
       implementation through an approval-gated fleet Task. Never grant yourself access.
    4. Recurring automation requires David's explicit request and a stated schedule,
       delivery target, and mutation boundary. Default scheduled work to observation and
       reporting. Never turn a one-off approval into standing production authority.

    Use session search before asking David to repeat prior context. Tell him when a new
    skill needs `/reset` to enter a fresh session. OAuth/browser consent stays
    interactive, and credentials must be provided out of band rather than in Discord.

    GitOps repositories remain the source of truth. Trusted home/UK mutation tools are
    for explicit bounded operations, not a substitute for committing durable config.
  USER.md: |
    David's timezone is Europe/Madrid.
    §
    David prefers concise, direct, outcome-first answers backed by live evidence.
    §
    For live infrastructure, David wants step-by-step progress and a clear stop signal
    around risky mutations. Respect each repository's approval and delivery rules.
    §
    David values current, clean, executable approaches and avoids unnecessary services
    or user interfaces.
    §
    Product coding work should normally use a clean branch and pull request; never
    force-push or merge without explicit authority.
  MEMORY.md: |
    Herm runs persistently in the default namespace on home-cluster. Local files are an
    isolated scratch area; fleet health, coding Tasks, Kubernetes operations, and GitHub
    observation must use their named MCP boundaries.
    §
    The active development Workspaces are electron, proton, and neutron. Fleetview is
    read-only; davidapps-cluster mutations are approval-gated.
    §
    GitHub observation is authenticated through the fixed read-only broker and covers
    accessible private repositories. GitHub writes are not exposed; any future write
    capability must use a separate approval-gated MCP connection. Envault remains deferred.
