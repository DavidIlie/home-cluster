---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: docker-regcred
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-identity
          image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              mkdir -p /opt/data/workspace
              if [ ! -s /opt/data/config.yaml ] || ! grep -q '^_config_version:' /opt/data/config.yaml; then
                cp /seed/user-config.yaml /opt/data/config.yaml
              fi
              cmp -s /seed/SOUL.md /opt/data/SOUL.md || cp /seed/SOUL.md /opt/data/SOUL.md
              mkdir -p /opt/data/memories
              if [ ! -e /opt/data/memories/USER.md ]; then
                cp /seed/USER.md /opt/data/memories/USER.md
              fi
              if [ ! -e /opt/data/memories/MEMORY.md ]; then
                cp /seed/MEMORY.md /opt/data/memories/MEMORY.md
              fi
              chmod 0600 /opt/data/config.yaml
              chmod 0600 /opt/data/SOUL.md
              chmod 0600 /opt/data/memories/USER.md
              chmod 0600 /opt/data/memories/MEMORY.md
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed
              mountPath: /seed
              readOnly: true
        - name: prepare-runtime
          image: ghcr.io/davidilie/hermes-agent:v2026.8.13-remote-fleet.af0ab3127@sha256:0daf5d9460daa61cb48a124bfce5108310e65b8eba193fb21f61c4ac28c6523c
          command: ["/opt/hermes/.venv/bin/python", "/bootstrap/prepare-runtime.py"]
          args:
            - --home
            - /opt/data
            - --user-id
            - "243009043260637184"
            - --timezone
            - Europe/Madrid
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: runtime-bootstrap
              mountPath: /bootstrap
              readOnly: true
      containers:
        - name: app
          image: ghcr.io/davidilie/hermes-agent:v2026.8.13-remote-fleet.af0ab3127@sha256:0daf5d9460daa61cb48a124bfce5108310e65b8eba193fb21f61c4ac28c6523c
          args: ["gateway", "run"]
          env:
            - name: TZ
              value: Europe/Madrid
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes
            - name: AGENT_BROWSER_ARGS
              value: --no-sandbox,--disable-dev-shm-usage
            - name: DISCORD_ALLOWED_USERS
              value: "243009043260637184"
            - name: DISCORD_HOME_CHANNEL
              value: "1537861134076350465"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-token
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: cliproxy-key
            - name: FLEETVIEW_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: fleetview-token
            - name: FLEET_GATEWAY_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: mcp-token
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
          ports:
            - name: health
              containerPort: 8642
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed
              mountPath: /etc/hermes
              readOnly: true
            - name: managed-skills
              mountPath: /etc/hermes-skills
              readOnly: true
            - name: work-context
              mountPath: /opt/data/workspace/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent
        - name: managed
          configMap:
            name: hermes-agent-managed
            defaultMode: 0444
        - name: managed-skills
          configMap:
            name: hermes-agent-skills
            defaultMode: 0444
            items:
              - key: david-work-audit-SKILL.md
                path: david-work-audit/SKILL.md
              - key: david-work-audit-protocol.md
                path: david-work-audit/references/audit-protocol.md
              - key: david-contract-writing-SKILL.md
                path: david-contract-writing/SKILL.md
              - key: david-contract-writing-method.md
                path: david-contract-writing/references/contract-method.md
              - key: media-library-SKILL.md
                path: media-library/SKILL.md
        - name: work-context
          configMap:
            name: hermes-agent-work-context
            defaultMode: 0444
        - name: runtime-bootstrap
          configMap:
            name: hermes-agent-runtime-bootstrap
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
