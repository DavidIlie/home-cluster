---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: docker-regcred
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-xurl
          image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: ["/bin/sh", "-ec"]
          args:
            - |
              archive=/tmp/xurl.tar.gz
              wget -q https://github.com/xdevplatform/xurl/releases/download/v1.3.1/xurl_Linux_x86_64.tar.gz -O "$${archive}"
              echo 'ccfc4b3ca5240565da650ef003b51d7f887eabe0c6e3797802410240289d4feb  /tmp/xurl.tar.gz' | sha256sum -c -
              mkdir -p /opt/xurl/libexec
              tar -xzf "$${archive}" -C /opt/xurl/libexec xurl
              chmod 0555 /opt/xurl/libexec/xurl
              cat > /opt/xurl/xurl <<'EOF'
              #!/bin/sh
              HOME=/opt/data/home exec /opt/xurl/libexec/xurl "$@"
              EOF
              chmod 0555 /opt/xurl/xurl
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: xurl-bin
              mountPath: /opt/xurl
            - name: tmp
              mountPath: /tmp
        - name: seed-identity
          image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              mkdir -p /opt/data/workspace
              # The process-wide managed scope must stay profile-neutral. Seed
              # David's complete owner config into only the default profile.
              if [ ! -e /opt/data/config.yaml ]; then
                cp /seed/owner-config.yaml /opt/data/config.yaml
              fi
              cmp -s /seed/SOUL.md /opt/data/SOUL.md || cp /seed/SOUL.md /opt/data/SOUL.md
              mkdir -p /opt/data/memories
              if [ ! -e /opt/data/memories/USER.md ]; then
                cp /seed/USER.md /opt/data/memories/USER.md
              fi
              if [ ! -e /opt/data/memories/MEMORY.md ]; then
                cp /seed/MEMORY.md /opt/data/memories/MEMORY.md
              fi
              chmod 0600 /opt/data/config.yaml
              chmod 0600 /opt/data/SOUL.md
              chmod 0600 /opt/data/memories/USER.md
              chmod 0600 /opt/data/memories/MEMORY.md
              mkdir -p /opt/data/profiles/friends/workspace
              cmp -s /friends-seed/config.yaml /opt/data/profiles/friends/config.yaml || cp /friends-seed/config.yaml /opt/data/profiles/friends/config.yaml
              cmp -s /friends-seed/SOUL.md /opt/data/profiles/friends/SOUL.md || cp /friends-seed/SOUL.md /opt/data/profiles/friends/SOUL.md
              cmp -s /friends-seed/AGENTS.md /opt/data/profiles/friends/workspace/AGENTS.md || cp /friends-seed/AGENTS.md /opt/data/profiles/friends/workspace/AGENTS.md
              mkdir -p /opt/data/profiles/friends-david/workspace
              cmp -s /friends-david-seed/config.yaml /opt/data/profiles/friends-david/config.yaml || cp /friends-david-seed/config.yaml /opt/data/profiles/friends-david/config.yaml
              cmp -s /friends-david-seed/SOUL.md /opt/data/profiles/friends-david/SOUL.md || cp /friends-david-seed/SOUL.md /opt/data/profiles/friends-david/SOUL.md
              cmp -s /friends-david-seed/AGENTS.md /opt/data/profiles/friends-david/workspace/AGENTS.md || cp /friends-david-seed/AGENTS.md /opt/data/profiles/friends-david/workspace/AGENTS.md
              printf 'DISCORD_BOT_TOKEN=%s\nDISCORD_ALLOWED_USERS=243009043260637184\nCLIPROXY_API_KEY=%s\nOPENAI_API_KEY=%s\nFLEETVIEW_MCP_TOKEN=%s\nFLEET_GATEWAY_MCP_TOKEN=%s\nAPI_SERVER_KEY=%s\nHERMES_FRIEND_CODE_DELIVERY_TOKEN=%s\nHERMES_FRIEND_CODE_OWNER_TOKEN=%s\nSEEDYN_BROKER_TOKEN=%s\n' \
                "$${DISCORD_BOT_TOKEN}" "$${CLIPROXY_API_KEY}" "$${CLIPROXY_API_KEY}" \
                "$${FLEETVIEW_MCP_TOKEN}" \
                "$${FLEET_GATEWAY_MCP_TOKEN}" "$${API_SERVER_KEY}" \
                "$${HERMES_FRIEND_CODE_DELIVERY_TOKEN}" "$${HERMES_FRIEND_CODE_OWNER_TOKEN}" \
                "$${SEEDYN_BROKER_TOKEN}" > /owner-env/owner.env
              printf 'CLIPROXY_API_KEY=%s\nDISCORD_ALLOW_ALL_USERS=true\nHERMES_FRIEND_CODE_MCP_TOKEN=%s\n' \
                "$${CLIPROXY_API_KEY}" "$${HERMES_FRIEND_CODE_MCP_TOKEN}" > /friends-env/friends.env
              printf 'CLIPROXY_API_KEY=%s\nOPENAI_API_KEY=%s\nDISCORD_ALLOWED_USERS=243009043260637184\nSEEDYN_BROKER_TOKEN=%s\n' \
                "$${CLIPROXY_API_KEY}" "$${CLIPROXY_API_KEY}" "$${SEEDYN_BROKER_TOKEN}" > /friends-david-env/friends-david.env
              chmod 0600 /opt/data/profiles/friends/config.yaml
              chmod 0600 /opt/data/profiles/friends/SOUL.md
              chmod 0600 /opt/data/profiles/friends/workspace/AGENTS.md
              chmod 0600 /opt/data/profiles/friends-david/config.yaml
              chmod 0600 /opt/data/profiles/friends-david/SOUL.md
              chmod 0600 /opt/data/profiles/friends-david/workspace/AGENTS.md
              chmod 0600 /owner-env/owner.env
              chmod 0600 /friends-env/friends.env
              chmod 0600 /friends-david-env/friends-david.env
          env:
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-token
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: cliproxy-key
            - name: FLEETVIEW_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: fleetview-token
            - name: FLEET_GATEWAY_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: mcp-token
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
            - name: HERMES_FRIEND_CODE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-friend-agent-tokens
                  key: friend-token
            - name: HERMES_FRIEND_CODE_DELIVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-friend-agent-tokens
                  key: delivery-token
            - name: HERMES_FRIEND_CODE_OWNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-friend-agent-tokens
                  key: owner-token
            - name: SEEDYN_BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-seedyn-secrets
                  key: seedyn-broker-token
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed
              mountPath: /seed
              readOnly: true
            - name: friends-profile
              mountPath: /friends-seed
              readOnly: true
            - name: friends-david-profile
              mountPath: /friends-david-seed
              readOnly: true
            - name: owner-env
              mountPath: /owner-env
            - name: friends-env
              mountPath: /friends-env
            - name: friends-david-env
              mountPath: /friends-david-env
        - name: prepare-runtime
          # Source: DavidIlie/hermes-agent@74525082b4f1e9dd7711f5b962560da71400adea
          image: ghcr.io/davidilie/hermes-agent-fleet:v2026.8.23-seedyn.74525082b4@sha256:13da480e1691dce9b971378348c0127ffa70bc392998a59b974f4de82ace907e
          command: ["/opt/hermes/.venv/bin/python", "/bootstrap/prepare-runtime.py"]
          args:
            - --home
            - /opt/data
            - --user-id
            - "243009043260637184"
            - --timezone
            - Europe/Madrid
            - --memory-char-limit
            - "24000"
            - --user-char-limit
            - "16000"
            - --owner-config
            - /seed/owner-config.yaml
            - --skip-replay
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: runtime-bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: managed
              mountPath: /seed
              readOnly: true
      containers:
        - name: app
          # Source: DavidIlie/hermes-agent@74525082b4f1e9dd7711f5b962560da71400adea
          image: ghcr.io/davidilie/hermes-agent-fleet:v2026.8.23-seedyn.74525082b4@sha256:13da480e1691dce9b971378348c0127ffa70bc392998a59b974f4de82ace907e
          args: ["gateway", "run"]
          env:
            - name: TZ
              value: Europe/Madrid
            - name: PATH
              value: /opt/xurl:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes
            - name: AGENT_BROWSER_ARGS
              value: --no-sandbox,--disable-dev-shm-usage
            - name: OPENAI_BASE_URL
              value: http://cliproxy.default.svc.cluster.local:8317/v1
            - name: DISCORD_ALLOWED_USERS
              value: "243009043260637184"
            - name: DISCORD_HOME_CHANNEL
              value: "1537861134076350465"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-token
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: cliproxy-key
            - name: FLEETVIEW_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: fleetview-token
            - name: FLEET_GATEWAY_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: mcp-token
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
          ports:
            - name: health
              containerPort: 8642
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: owner-env
              mountPath: /opt/data/.env
              subPath: owner.env
              readOnly: true
            - name: friends-env
              mountPath: /opt/data/profiles/friends/.env
              subPath: friends.env
              readOnly: true
            - name: friends-david-env
              mountPath: /opt/data/profiles/friends-david/.env
              subPath: friends-david.env
              readOnly: true
            - name: managed
              mountPath: /etc/hermes
              readOnly: true
            - name: managed-skills
              mountPath: /etc/hermes-skills
              readOnly: true
            - name: seedyn-skills
              mountPath: /etc/hermes-seedyn-skills
              readOnly: true
            - name: work-context
              mountPath: /opt/data/workspace/AGENTS.md
              subPath: AGENTS.md
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: xurl-bin
              mountPath: /opt/xurl
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent
        - name: managed
          configMap:
            name: hermes-agent-managed
            defaultMode: 0444
        - name: managed-skills
          configMap:
            name: hermes-agent-skills
            defaultMode: 0444
            items:
              - key: david-work-audit-SKILL.md
                path: david-work-audit/SKILL.md
              - key: david-work-audit-protocol.md
                path: david-work-audit/references/audit-protocol.md
              - key: david-contract-writing-SKILL.md
                path: david-contract-writing/SKILL.md
              - key: david-contract-writing-method.md
                path: david-contract-writing/references/contract-method.md
              - key: media-library-SKILL.md
                path: media-library/SKILL.md
        - name: work-context
          configMap:
            name: hermes-agent-work-context
            defaultMode: 0444
        - name: runtime-bootstrap
          configMap:
            name: hermes-agent-runtime-bootstrap
            defaultMode: 0444
        - name: friends-profile
          configMap:
            name: hermes-agent-friends-profile
            defaultMode: 0444
        - name: friends-david-profile
          configMap:
            name: hermes-agent-friends-david-profile
            defaultMode: 0444
        - name: seedyn-skills
          configMap:
            name: hermes-agent-seedyn-skills
            defaultMode: 0444
            items:
              - key: seedyn-delivery-SKILL.md
                path: seedyn-delivery/SKILL.md
        - name: owner-env
          emptyDir: {}
        - name: friends-env
          emptyDir: {}
        - name: friends-david-env
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: xurl-bin
          emptyDir: {}
