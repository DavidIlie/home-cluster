---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-identity
          image: docker.io/library/alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              mkdir -p /opt/data/workspace
              if [ ! -s /opt/data/SOUL.md ]; then
                cp /seed/SOUL.md /opt/data/SOUL.md
              fi
              chmod 0600 /opt/data/SOUL.md
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed
              mountPath: /seed/SOUL.md
              subPath: SOUL.md
              readOnly: true
      containers:
        - name: app
          image: docker.io/nousresearch/hermes-agent:v2026.8.13@sha256:68e15ae2a6d894d0ccbd9f8aacbbe13d4d28fa5dc9b6a303970b67bb2499b1a6
          args: ["gateway", "run"]
          env:
            - name: TZ
              value: Europe/Madrid
            - name: HERMES_MANAGED_DIR
              value: /etc/hermes
            - name: DISCORD_ALLOWED_USERS
              value: "243009043260637184"
            - name: DISCORD_HOME_CHANNEL
              value: "1537861134076350465"
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: discord-token
            - name: CLIPROXY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: cliproxy-key
            - name: FLEETVIEW_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: fleetview-token
            - name: FLEET_GATEWAY_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: mcp-token
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: api-server-key
          ports:
            - name: health
              containerPort: 8642
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: managed
              mountPath: /etc/hermes
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent
        - name: managed
          configMap:
            name: hermes-agent-managed
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
