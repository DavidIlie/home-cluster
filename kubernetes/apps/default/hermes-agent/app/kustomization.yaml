---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./claim.yaml
  - ./configmap.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./networkpolicy.yaml
components:
  - ../../../../flux/components/volsync
configMapGenerator:
  - name: hermes-agent-skills
    files:
      - david-work-audit-SKILL.md=skills/david-work-audit/SKILL.md
      - david-work-audit-protocol.md=skills/david-work-audit/references/audit-protocol.md
      - david-contract-writing-SKILL.md=skills/david-contract-writing/SKILL.md
      - david-contract-writing-method.md=skills/david-contract-writing/references/contract-method.md
      - media-library-SKILL.md=skills/media-library/SKILL.md
  - name: hermes-agent-work-context
    files:
      - AGENTS.md=context/AGENTS.md
  - name: hermes-agent-runtime-bootstrap
    files:
      - prepare-runtime.py=scripts/prepare-runtime.py
  - name: hermes-agent-friends-profile
    files:
      - config.yaml=profiles/friends/config.yaml
      - SOUL.md=profiles/friends/SOUL.md
      - AGENTS.md=profiles/friends/AGENTS.md
  - name: hermes-agent-friends-david-profile
    files:
      - config.yaml=profiles/friends-david/config.yaml
      - SOUL.md=profiles/friends-david/SOUL.md
      - AGENTS.md=profiles/friends-david/AGENTS.md
  - name: hermes-agent-seedyn-skills
    files:
      - seedyn-delivery-SKILL.md=skills/seedyn-delivery/SKILL.md
  - name: hermes-agent-friends-david-skills
    files:
      - bostan-meme-SKILL.md=skills/bostan-meme/SKILL.md
  - name: hermes-agent-friends-david-meme-engine
    files:
      - README.md=skills/bostan-meme/engine/README.md
      - STYLE_GUIDE.md=skills/bostan-meme/engine/STYLE_GUIDE.md
      - author_prompt.py=skills/bostan-meme/engine/author_prompt.py
      - authoring.py=skills/bostan-meme/engine/authoring.py
      - corpus.py=skills/bostan-meme/engine/corpus.py
      - cron_hourly.py=skills/bostan-meme/engine/cron_hourly.py
      - feedback.py=skills/bostan-meme/engine/feedback.py
      - import_thread_people.py=skills/bostan-meme/engine/import_thread_people.py
      - meme_engine.py=skills/bostan-meme/engine/meme_engine.py
      - premises.py=skills/bostan-meme/engine/premises.py
      - prepare_assets.py=skills/bostan-meme/engine/prepare_assets.py
      - test_engine.py=skills/bostan-meme/engine/test_engine.py
generatorOptions:
  disableNameSuffixHash: true
