---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes-agent
  namespace: &namespace default
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: hermes
      namespace: default
    - name: cliproxy
      namespace: default
    - name: openebs
      namespace: openebs-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/default/hermes-agent/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      APP: *app
      APP_PVC: *app
      MOVER_UID: "10000"
      MOVER_GID: "10000"
      MOVER_FSGROUP: "10000"
    substituteFrom:
      - kind: Secret
        name: volsync-secret
