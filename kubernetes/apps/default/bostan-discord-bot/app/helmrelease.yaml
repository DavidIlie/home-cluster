# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bostan-discord-bot
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      bostan-discord-bot:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          terminationGracePeriodSeconds: 30
        containers:
          app:
            image:
              repository: ghcr.io/bostanenterprise/bostan-discord-bot # {"$imagepolicy": "flux-system:bostan-discord-bot:name"}
              tag: main-8b086708-1787734350 # {"$imagepolicy": "flux-system:bostan-discord-bot:tag"}
            env:
              NODE_ENV: production
              TZ: Europe/Bucharest
              DISCORD_GUILD_ID: "1540757211146493993"
              DISCORD_ADMIN_USER_IDS: "243009043260637184,968951950446063676"
              DISCORD_BOT_TOKEN_FILE: /run/secrets/bostan/discord-bot-token
              INTERACTION_SIGNING_SECRET_FILE: /run/secrets/bostan/interaction-signing-secret
              GITHUB_TOKEN_FILE: /run/secrets/bostan/github-token
              GITHUB_POLL_INTERVAL_SECONDS: "60"
              DATA_DIR: /data
              HEALTH_PORT: "8080"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: &port 8080
                  periodSeconds: 2
                  timeoutSeconds: 2
                  failureThreshold: 45
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 2
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
    defaultPodOptions:
      imagePullSecrets:
        - name: docker-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    persistence:
      data:
        existingClaim: bostan-discord-bot
        globalMounts:
          - path: /data
      secrets:
        type: secret
        name: bostan-discord-bot-secret
        defaultMode: 0440
        globalMounts:
          - path: /run/secrets/bostan
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
    service:
      app:
        controller: *app
        ports:
          health:
            port: *port
