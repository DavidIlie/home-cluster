          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
              - X-Davidapps-Protection-Bypass
              - X-Davidapps-Set-Bypass-Cookie
              - X-Original-Host
              - X-Original-Method
              - X-Original-URL
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /_da/gate/password
      backendRefs:
        - name: davidapps-gate
          namespace: auth
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /_da/gate/redeem
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
              - X-Davidapps-Protection-Bypass
