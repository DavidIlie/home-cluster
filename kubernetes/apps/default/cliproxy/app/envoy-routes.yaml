apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxy-open-api
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - cliproxy.davidhome.ro
    - cliproxyapi.davidhome.ro
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /v1beta
        - path:
            type: PathPrefix
            value: /openai/v1
        - path:
            type: PathPrefix
            value: /backend-api/codex
        - path:
            type: PathPrefix
            value: /healthz
        - path:
            type: Exact
            value: /backend-api/wham/usage
        - path:
            type: Exact
            value: /api/oauth/usage
        - path:
            type: Exact
            value: /internal/employee-hub/v1/usage
        - path:
            type: Exact
            value: /internal/employee-hub/v1/api-key/reveal
        - path:
            type: Exact
            value: /internal/employee-hub/v1/api-key/owner-binding
        - path:
            type: Exact
            value: /internal/employee-hub/v1/api-key/provision
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
              - X-Davidapps-Protection-Bypass
              - X-Davidapps-Set-Bypass-Cookie
              - X-Original-Host
              - X-Original-Method
              - X-Original-URL
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: cliproxy
          port: 8317
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxy-management
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-grafana
      namespace: network
      sectionName: https
  hostnames:
    - cliproxy.davidhome.ro
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /management.html
        - path:
            type: Exact
            value: /anthropic/callback
        - path:
            type: Exact
            value: /codex/callback
        - path:
            type: Exact
            value: /antigravity/callback
        - path:
            type: PathPrefix
            value: /v0/management
        - path:
            type: PathPrefix
            value: /v8/management
        - path:
            type: PathPrefix
            value: /v0/resource/plugins
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
              - X-Davidapps-Protection-Bypass
              - X-Davidapps-Set-Bypass-Cookie
              - X-Original-Host
              - X-Original-Method
              - X-Original-URL
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: cliproxy
          port: 8317
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxy-gate
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - cliproxy.davidhome.ro
  rules:
    - matches:
        - path:
            type: Exact
            value: /_da/gate/start
