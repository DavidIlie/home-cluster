        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /start
      backendRefs:
        - name: davidapps-gate
          namespace: auth
          port: 8080
    - matches:
        - path:
            type: Exact
