            path:
              type: ReplaceFullPath
              replaceFullPath: /_da/gate/redeem
      backendRefs:
        - name: davidapps-gate
          namespace: auth
          port: 8080
    - matches:
        - path:
            type: Exact
            value: /_da/gate/bypass
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
