apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxy-open-api
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - cliproxy.davidhome.ro
    - cliproxyapi.davidhome.ro
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /v1beta
        - path:
            type: PathPrefix
            value: /openai/v1
        - path:
            type: PathPrefix
            value: /backend-api/codex
        - path:
            type: PathPrefix
            value: /healthz
        - path:
            type: Exact
            value: /backend-api/wham/usage
        - path:
            type: Exact
            value: /api/oauth/usage
        - path:
            type: Exact
            value: /internal/employee-hub/v1/usage
        - path:
            type: Exact
            value: /internal/employee-hub/v1/api-key/reveal
        - path:
            type: Exact
            value: /internal/employee-hub/v1/api-key/owner-binding
        - path:
            type: Exact
            value: /internal/employee-hub/v1/api-key/provision
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
              - X-Davidapps-Protection-Bypass
              - X-Davidapps-Set-Bypass-Cookie
              - X-Original-Host
              - X-Original-Method
              - X-Original-URL
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: cliproxy
          port: 8317
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxy-management
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-grafana
      namespace: network
      sectionName: https
  hostnames:
    - cliproxy.davidhome.ro
  rules:
    - matches:
        - path:
            type: Exact
            value: /
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: Exact
            value: /management.html
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: Exact
            value: /anthropic/callback
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: Exact
            value: /codex/callback
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: Exact
            value: /antigravity/callback
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: PathPrefix
            value: /v0/management
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: PathPrefix
            value: /v8/management
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
        - path:
            type: PathPrefix
            value: /v0/resource/plugins
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{7,}|[3-9][0-9]{6}|2[1-9][0-9]{5}|209[8-9][0-9]{3}|2097[2-9][0-9]{2}|20971[6-9][0-9]|209715[3-9])
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: cliproxy-payload-too-large
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: Exact
            value: /management.html
        - path:
            type: Exact
            value: /anthropic/callback
        - path:
            type: Exact
            value: /codex/callback
        - path:
            type: Exact
            value: /antigravity/callback
        - path:
            type: PathPrefix
            value: /v0/management
        - path:
            type: PathPrefix
            value: /v8/management
        - path:
            type: PathPrefix
            value: /v0/resource/plugins
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: '%REQ(cf-connecting-ip)%'
              - name: X-Real-IP
                value: '%REQ(cf-connecting-ip)%'
            remove:
              - X-Davidapps-Protection-Bypass
              - X-Davidapps-Set-Bypass-Cookie
              - X-Original-Host
              - X-Original-Method
              - X-Original-URL
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
      backendRefs:
        - name: cliproxy
          port: 8317
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxy-gate
  annotations:
    gatus.home-operations.com/enabled: "false"
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - cliproxy.davidhome.ro
  rules:
    - matches:
        - path:
            type: Exact
            value: /_da/gate/start
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{4,}|[5-9][0-9]{3}|4[1-9][0-9]{2}|409[7-9])
        - path:
            type: Exact
            value: /_da/callback
          headers:
            - name: Content-Length
              type: RegularExpression
              value: 0*(?:[1-9][0-9]{4,}|[5-9][0-9]{3}|4[1-9][0-9]{2}|409[7-9])
        - path:
