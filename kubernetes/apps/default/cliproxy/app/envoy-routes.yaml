              - name: Strict-Transport-Security
                value: max-age=31449600; includeSubDomains
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /callback
      backendRefs:
        - name: davidapps-gate
          namespace: auth
          port: 8080
    - matches:
