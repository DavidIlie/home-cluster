---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: cliproxy-management
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: cliproxy-management
  extAuth:
    failOpen: false
    headersToExtAuth:
      - cookie
      - authorization
      - x-davidapps-protection-bypass
      - x-davidapps-set-bypass-cookie
      - x-forwarded-proto
      - sec-fetch-dest
      - accept
    http:
      backendRefs:
        - name: davidapps-gate
          namespace: auth
          port: 8080
      path: /gate/ext-authz
      headersToBackend:
        - x-da-assertion
        - x-da-user
        - x-da-email
        - x-da-name
        - x-da-kind
        - x-da-rol
        - x-da-epoch
        - x-da-tid
    timeout: 5s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: cliproxy-management
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: cliproxy-management
  mergeType: StrategicMerge
  requestBuffer:
    mode: BufferAndLimit
    limit: 2Mi
  timeout:
    tcp:
      connectTimeout: 5s
    http:
      streamIdleTimeout: 15s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: cliproxy-gate
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: cliproxy-gate
  mergeType: StrategicMerge
  requestBuffer:
    mode: BufferAndLimit
    limit: 4Ki
  timeout:
    tcp:
      connectTimeout: 5s
    http:
      streamIdleTimeout: 15s
