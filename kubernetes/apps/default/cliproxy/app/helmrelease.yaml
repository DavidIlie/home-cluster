---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxy
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      cliproxy:
        replicas: 1
        strategy: Recreate
        annotations:
          # config.yaml is mounted with subPath, and subPath mounts never receive
          # kubelet secret updates -- without this, edits to secret.sops.yaml sit
          # in git looking applied while the pod keeps the old config forever.
          reloader.stakater.com/auto: "true"
        initContainers:
          # Plugins are c-shared .so files loaded via dlopen. config.yaml is a read-only
          # SOPS secret, so the Plugin Store UI cannot install them (it writes config).
          # Cache pinned, checksum-verified binaries on the plugin-data PVC. A cold cache
          # retries through cluster-start DNS races and fails closed rather than starting
          # CLIProxy without the routes required by the observability exporter.
          plugin-installer:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command:
              - sh
              - -c
              - |
                set -eu

                # renovate: datasource=github-releases depName=zhumengling/codex-token-usage
                CODEX_TOKEN_USAGE_VERSION=0.1.43
                CODEX_TOKEN_USAGE_ZIP_SHA256=37d9b03f55049d6bd2586cc6acbc495107dfa4a6b679753550711ddb38132ce7
                CODEX_TOKEN_USAGE_SO_SHA256=c5e36a5a540ba0e075b2c7d26a49ddcd0a6ad1c270147674234da8d846c34bd2
                PLUGIN_CACHE_DIR=/CLIProxyAPI/plugin-data/plugin-cache
                DOWNLOAD_ATTEMPTS=24
                mkdir -p "$${PLUGIN_CACHE_DIR}"

                # NOTE: $$ escapes the $ so Flux's strict-mode envsubst leaves these
                # shell variables alone during postBuild substitution.
                install_plugin() {
                  id="$${1}"
                  ver="$${2}"
                  url="$${3}"
                  zip_sha256="$${4}"
                  so_sha256="$${5}"
                  destination="/plugins/$${id}-v$${ver}.so"
                  cache="$${PLUGIN_CACHE_DIR}/$${id}-v$${ver}.so"

                  rm -f "/plugins/$${id}"*.so
                  if [ -s "$${cache}" ] \
                    && echo "$${so_sha256}  $${cache}" | sha256sum -c - >/dev/null 2>&1; then
                    cp "$${cache}" "$${destination}"
                    echo "installed $${id} $${ver} from persistent cache"
                    return 0
                  fi

                  rm -f "$${cache}"
                  attempt=1
                  while [ "$${attempt}" -le "$${DOWNLOAD_ATTEMPTS}" ]; do
                    workdir="$$(mktemp -d "/tmp/$${id}.XXXXXX")"
                    echo "fetching $${id} $${ver} (attempt $${attempt}/$${DOWNLOAD_ATTEMPTS})"
                    if wget -q -T 20 -O "$${workdir}/plugin.zip" "$${url}" \
                      && echo "$${zip_sha256}  $${workdir}/plugin.zip" | sha256sum -c - >/dev/null \
                      && unzip -q "$${workdir}/plugin.zip" -d "$${workdir}" \
                      && echo "$${so_sha256}  $${workdir}/$${id}.so" | sha256sum -c - >/dev/null; then
                      cp "$${workdir}/$${id}.so" "$${cache}.tmp"
                      chmod 0644 "$${cache}.tmp"
                      mv -f "$${cache}.tmp" "$${cache}"
                      cp "$${cache}" "$${destination}"
                      rm -rf "$${workdir}"
                      echo "installed and cached $${id} $${ver}"
                      return 0
                    fi
                    rm -rf "$${workdir}"
                    attempt="$$(($${attempt} + 1))"
                    sleep 5
                  done

                  echo "ERROR: could not install required plugin $${id} $${ver}" >&2
                  return 1
                }

                # NOTE: Fwindy/cpa-usage-statistics was removed deliberately. On
                # CPA v7.2.99+ it loads, registers and serves its route but never
                # receives a usage record, so it always answers {} -- it burned a
                # download and a dlopen for nothing. codex-token-usage covers this.
                install_plugin codex-token-usage "$${CODEX_TOKEN_USAGE_VERSION}" \
                  "https://github.com/zhumengling/codex-token-usage/releases/download/v$${CODEX_TOKEN_USAGE_VERSION}/codex-token-usage_$${CODEX_TOKEN_USAGE_VERSION}_linux_amd64.zip" \
                  "$${CODEX_TOKEN_USAGE_ZIP_SHA256}" \
                  "$${CODEX_TOKEN_USAGE_SO_SHA256}"

                ls -la /plugins
                exit 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              tag: v7.2.140@sha256:87c0bc86d4a8d6a5aff670bbdfea18bfe28decfee0888924301b502d57fe303e
            env:
              TZ: Europe/Bucharest
              # The plugin resolves its SQLite directory from $HOME by default,
              # which is not set for uid 1000. Point it at the PVC. This is
              # env-only -- there is no YAML config key for it.
              CPA_TOKEN_USAGE_DIR: /CLIProxyAPI/plugin-data/codex-token-usage
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8317
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: cliproxy
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "false"
          gatus.home-operations.com/endpoint: |-
            name: CLI Proxy API
            group: Utilities
            url: https://cliproxy.davidhome.ro
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &host "cliproxy.davidhome.ro"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts: [*host]
    persistence:
      config:
        type: secret
        name: cliproxy-config
        globalMounts:
          - path: /CLIProxyAPI/config.yaml
            subPath: config.yaml
            readOnly: true
      auths:
        existingClaim: cliproxy
        globalMounts:
          - path: /CLIProxyAPI/auths
      # Plugin binaries are copied from the persistent, checksum-verified cache into
      # this runtime-only directory on every start.
      plugins:
        type: emptyDir
        advancedMounts:
          cliproxy:
            plugin-installer:
              - path: /plugins
            app:
              - path: /CLIProxyAPI/plugins
      # SQLite usage history written by codex-token-usage. Survives restarts, and
      # is backed up by the dedicated ReplicationSource in volsync-plugin-data.yaml
      # (the shared volsync component only covers ${APP_PVC}).
      plugin-data:
        existingClaim: cliproxy-plugin-data
        globalMounts:
          - path: /CLIProxyAPI/plugin-data
      logs:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/logs
      static:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/static
      # readOnlyRootFilesystem is on, so the plugin installer needs a writable scratch dir.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
