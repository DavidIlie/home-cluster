# yaml-language-server: $schema=https://raw.githubusercontent.com/bernd-schorgers/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cliproxy
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      cliproxy:
        replicas: 1
        strategy: Recreate
        pod:
          imagePullSecrets:
            - name: docker-regcred
        annotations:
          # Restart for public assertion-key changes. The encrypted config is only
          # a first-boot seed after migration; the writable PVC is authoritative.
          reloader.stakater.com/auto: "true"
        initContainers:
          config-bootstrap:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command: ["sh", "-ec"]
            args:
              - |
                if [ ! -s /data/config.yaml ]; then
                  install -m 0600 /bootstrap/config.yaml /data/config.yaml
                fi
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
          # Plugins are c-shared .so files loaded via dlopen. Cache pinned,
          # checksum-verified binaries on the plugin-data PVC. A cold cache
          # retries through cluster-start DNS races and fails closed rather than starting
          # CLIProxy without the routes required by the observability exporter.
          plugin-installer:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
            command:
              - sh
              - -c
              - |
                set -eu

                # renovate: datasource=github-releases depName=zhumengling/codex-token-usage
                CODEX_TOKEN_USAGE_VERSION=0.1.43
                CODEX_TOKEN_USAGE_ZIP_SHA256=37d9b03f55049d6bd2586cc6acbc495107dfa4a6b679753550711ddb38132ce7
                CODEX_TOKEN_USAGE_SO_SHA256=c5e36a5a540ba0e075b2c7d26a49ddcd0a6ad1c270147674234da8d846c34bd2
                PLUGIN_CACHE_DIR=/CLIProxyAPI/plugin-data/plugin-cache
                DOWNLOAD_ATTEMPTS=24
                mkdir -p "$${PLUGIN_CACHE_DIR}"

                # NOTE: $$ escapes the $ so Flux's strict-mode envsubst leaves these
                # shell variables alone during postBuild substitution.
                install_plugin() {
                  id="$${1}"
                  ver="$${2}"
                  url="$${3}"
                  zip_sha256="$${4}"
                  so_sha256="$${5}"
                  destination="/plugins/$${id}-v$${ver}.so"
                  cache="$${PLUGIN_CACHE_DIR}/$${id}-v$${ver}.so"

                  rm -f "/plugins/$${id}"*.so
                  if [ -s "$${cache}" ] \
                    && echo "$${so_sha256}  $${cache}" | sha256sum -c - >/dev/null 2>&1; then
                    cp "$${cache}" "$${destination}"
                    echo "installed $${id} $${ver} from persistent cache"
                    return 0
                  fi

                  rm -f "$${cache}"
                  attempt=1
                  while [ "$${attempt}" -le "$${DOWNLOAD_ATTEMPTS}" ]; do
                    workdir="$$(mktemp -d "/tmp/$${id}.XXXXXX")"
                    echo "fetching $${id} $${ver} (attempt $${attempt}/$${DOWNLOAD_ATTEMPTS})"
                    if wget -q -T 20 -O "$${workdir}/plugin.zip" "$${url}" \
                      && echo "$${zip_sha256}  $${workdir}/plugin.zip" | sha256sum -c - >/dev/null \
                      && unzip -q "$${workdir}/plugin.zip" -d "$${workdir}" \
                      && echo "$${so_sha256}  $${workdir}/$${id}.so" | sha256sum -c - >/dev/null; then
                      cp "$${workdir}/$${id}.so" "$${cache}.tmp"
                      chmod 0644 "$${cache}.tmp"
                      mv -f "$${cache}.tmp" "$${cache}"
                      cp "$${cache}" "$${destination}"
                      rm -rf "$${workdir}"
                      echo "installed and cached $${id} $${ver}"
                      return 0
                    fi
                    rm -rf "$${workdir}"
                    attempt="$$(($${attempt} + 1))"
                    sleep 5
                  done

                  echo "ERROR: could not install required plugin $${id} $${ver}" >&2
                  return 1
                }

                # NOTE: Fwindy/cpa-usage-statistics was removed deliberately. On
                # CPA v7.2.99+ it loads, registers and serves its route but never
                # receives a usage record, so it always answers {} -- it burned a
                # download and a dlopen for nothing. codex-token-usage covers this.
                install_plugin codex-token-usage "$${CODEX_TOKEN_USAGE_VERSION}" \
                  "https://github.com/zhumengling/codex-token-usage/releases/download/v$${CODEX_TOKEN_USAGE_VERSION}/codex-token-usage_$${CODEX_TOKEN_USAGE_VERSION}_linux_amd64.zip" \
                  "$${CODEX_TOKEN_USAGE_ZIP_SHA256}" \
                  "$${CODEX_TOKEN_USAGE_SO_SHA256}"

                ls -la /plugins
                exit 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/davidilie/cliproxyapi # {"$imagepolicy": "flux-system:cliproxy:name"}
              tag: main-ded91e5c-1788267340 # {"$imagepolicy": "flux-system:cliproxy:tag"}
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["-config", "/config-data/config.yaml"]
            env:
              TZ: Europe/Bucharest
              DAVIDAPPS_ASSERTION_ISSUER:
                valueFrom:
                  configMapKeyRef:
                    name: cliproxy-davidapps-public
                    key: issuer
              DAVIDAPPS_ASSERTION_AUDIENCE:
                valueFrom:
                  configMapKeyRef:
                    name: cliproxy-davidapps-public
                    key: audience
              DAVIDAPPS_APPLICATION_ID:
                valueFrom:
                  configMapKeyRef:
                    name: cliproxy-davidapps-public
                    key: application-id
              DAVIDAPPS_ASSERTION_KID:
                valueFrom:
                  configMapKeyRef:
                    name: cliproxy-davidapps-public
                    key: assertion-key-id
              DAVIDAPPS_ASSERTION_PUBLIC_KEY:
                valueFrom:
                  configMapKeyRef:
                    name: cliproxy-davidapps-public
                    key: assertion-public-key
              # The plugin resolves its SQLite directory from $HOME by default,
              # which is not set for uid 1000. Point it at the PVC. This is
              # env-only -- there is no YAML config key for it.
              CPA_TOKEN_USAGE_DIR: /CLIProxyAPI/plugin-data/codex-token-usage
              EMPLOYEE_HUB_SERVICE_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cliproxy-employee-hub
                    key: EMPLOYEE_HUB_SERVICE_TOKEN
              EMPLOYEE_HUB_REVEAL_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cliproxy-employee-hub
                    key: EMPLOYEE_HUB_REVEAL_TOKEN
              EMPLOYEE_HUB_BINDING_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cliproxy-employee-hub
                    key: EMPLOYEE_HUB_BINDING_TOKEN
              CLIPROXY_API_KEY_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cliproxy-employee-hub
                    key: CLIPROXY_API_KEY_ENCRYPTION_KEY
              # Persist managed-key quota attribution across rollouts on the
              # dedicated, backed-up plugin data volume.
              CLIPROXY_QUOTA_LEDGER_PATH: /CLIProxyAPI/plugin-data/managed-key-quota-ledger.json
              CLIPROXY_QUOTA_POLL_INTERVAL: 1m
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8317
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: cliproxy
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        serviceName: cliproxy
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    ingress:
      open-api:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.davidhome.ro"
          gethomepage.dev/enabled: "false"
          nginx.ingress.kubernetes.io/proxy-set-headers: auth/davidapps-empty-trusted-headers
          gatus.home-operations.com/endpoint: |-
            name: CLI Proxy API
            group: Utilities
            url: https://cliproxy.davidhome.ro/healthz
            interval: 1m
            conditions: ["[STATUS] == 200"]
        hosts:
          - host: &host "cliproxy.davidhome.ro"
            paths: &openApiPaths
              - path: /v1
                service: &appService
                  identifier: app
                  port: http
              - path: /v1beta
                service: *appService
              - path: /openai/v1
                service: *appService
              - path: /backend-api/codex
                service: *appService
              - path: /backend-api/wham/usage
                pathType: Exact
                service: *appService
              - path: /api/oauth/usage
                pathType: Exact
                service: *appService
              - path: /healthz
                service: *appService
              - path: /internal/employee-hub/v1/usage
                pathType: Exact
                service: *appService
              - path: /internal/employee-hub/v1/api-key/reveal
                pathType: Exact
                service: *appService
              - path: /internal/employee-hub/v1/api-key/owner-binding
                pathType: Exact
                service: *appService
          - host: &apiHost "cliproxyapi.davidhome.ro"
            paths: *openApiPaths
        tls:
          - hosts: [*host, *apiHost]
      management:
        className: external
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.davidhome.ro"
          nginx.ingress.kubernetes.io/auth-url: "http://davidapps-gate.auth.svc.cluster.local:8080/gate/check"
          nginx.ingress.kubernetes.io/auth-signin: "https://$host/_da/gate/start"
          nginx.ingress.kubernetes.io/auth-signin-redirect-param: rd
          nginx.ingress.kubernetes.io/auth-always-set-cookie: "true"
          nginx.ingress.kubernetes.io/auth-cache-duration: "200 202 0s, 401 0s"
          nginx.ingress.kubernetes.io/auth-response-headers: X-DA-Assertion,X-DA-User,X-DA-Email,X-DA-Name,X-DA-Kind,X-DA-Rol,X-DA-Epoch,X-DA-Tid
          nginx.ingress.kubernetes.io/proxy-body-size: 2m
          nginx.ingress.kubernetes.io/client-body-buffer-size: 16k
          nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
          nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "15"
          nginx.ingress.kubernetes.io/proxy-buffer-size: 8k
          nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
          nginx.ingress.kubernetes.io/proxy-set-headers: auth/davidapps-empty-trusted-headers
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Exact
                service: *appService
              - path: /management.html
                pathType: Exact
                service: *appService
              - path: /v0/management
                service: *appService
              - path: /anthropic/callback
                pathType: Exact
                service: *appService
              - path: /codex/callback
                pathType: Exact
                service: *appService
              - path: /antigravity/callback
                pathType: Exact
                service:
                  identifier: app
                  port: http
        tls:
          - hosts: [*host]
    persistence:
      config-bootstrap:
        type: secret
        name: cliproxy-config
        advancedMounts:
          cliproxy:
            config-bootstrap:
              - path: /bootstrap/config.yaml
                subPath: config.yaml
                readOnly: true
      config-data:
        existingClaim: cliproxy-config-data
        advancedMounts:
          cliproxy:
            config-bootstrap:
              - path: /data
            app:
              - path: /config-data
      auths:
        existingClaim: cliproxy
        globalMounts:
          - path: /CLIProxyAPI/auths
      # Plugin binaries are copied from the persistent, checksum-verified cache into
      # this runtime-only directory on every start.
      plugins:
        type: emptyDir
        advancedMounts:
          cliproxy:
            plugin-installer:
              - path: /plugins
            app:
              - path: /CLIProxyAPI/plugins
      # SQLite usage history written by codex-token-usage. Survives restarts, and
      # is backed up by the dedicated ReplicationSource in volsync-plugin-data.yaml
      # (the shared volsync component only covers ${APP_PVC}).
      plugin-data:
        existingClaim: cliproxy-plugin-data
        globalMounts:
          - path: /CLIProxyAPI/plugin-data
      logs:
        type: emptyDir
        globalMounts:
          - path: /CLIProxyAPI/logs
      # readOnlyRootFilesystem is on, so the plugin installer needs a writable scratch dir.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
