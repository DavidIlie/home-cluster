# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uber-item-viewer
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      uber-item-viewer:
        pod:
          imagePullSecrets:
            - name: docker-regcred
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/davidilie/uber-item-viewer # {"$imagepolicy": "flux-system:uber-item-viewer:name"}
              tag: github-hosted-2b0f004f-1792711957 # {"$imagepolicy": "flux-system:uber-item-viewer:tag"}
            env:
              UBER_ENDPOINT: "https://uberapi.davidhome.ro"
              APP_URL: "https://uber.gurt.ing"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: uber-item-viewer
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            name: Uber Item Viewer (Envoy)
            group: Services
            url: https://uber.gurt.ing
            interval: 1m
            client:
              dns-resolver: tcp://1.1.1.1:53
            conditions: ["[STATUS] == 200"]
        hostnames:
          - uber.gurt.ing
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: X-Forwarded-For
                      value: '%REQ(cf-connecting-ip)%'
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: "max-age=31449600; includeSubDomains"
            backendRefs:
              - name: uber-item-viewer
                port: 3000
    ingress:
      app:
        className: external
        annotations:
          gatus.home-operations.com/enabled: "false"
          external-dns.alpha.kubernetes.io/target: "external.davidhome.ro"
        hosts:
          - host: "uber.gurt.ing"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
