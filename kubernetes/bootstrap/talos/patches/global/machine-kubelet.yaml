machine:
  kubelet:
    extraConfig:
      maxPods: 200
      # Drop images no pod has used for a week. Size-based GC alone keeps the
      # EPHEMERAL disk (shared with etcd) at up to 85% with old app tags.
      imageMaximumGCAge: 168h
    extraMounts:
      - destination: /var/openebs/local
        type: bind
        source: /var/openebs/local
        options:
          - bind
          - rshared
          - rw
    nodeIP:
      validSubnets:
        - 192.168.100.0/24
